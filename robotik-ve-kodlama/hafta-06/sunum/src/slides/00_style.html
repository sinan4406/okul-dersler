<style>
@keyframes wv{to{transform:translateX(-80px)}}
.wv{animation:wv 4s linear infinite}
@keyframes blk{0%,46%{opacity:1}50%,96%{opacity:0}100%{opacity:1}}
@keyframes blk2{0%,46%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
.bl1{animation:blk 3s infinite}.bl2{animation:blk2 3s infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.flow{stroke-dasharray:14 14;animation:flow 0.9s linear infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.wv,.bl1,.bl2,.flow,.pop{animation:none}.bl2{opacity:0}}
.goal{display:flex;flex-direction:row;gap:24px;align-items:center;background:#FFFFFF;border:1px solid #E2DED3;border-radius:16px;padding:20px 28px}
.goal b.no{font-size:44px;font-weight:700;color:#C2410C;min-width:44px;text-align:center}
.goal p{font-size:27px;line-height:1.3;color:#1B2533}
.opt{display:flex;flex-direction:row;gap:18px;align-items:center;border-radius:16px;padding:18px 28px;background:#1F2E40;border:2px solid #2A3B50;cursor:pointer;font:inherit;color:#F6F4EE;text-align:left;width:100%}
.opt:hover{border-color:#FF9F5A}
.opt .ab{font-size:34px;font-weight:700;color:#FF9F5A;min-width:40px}
.opt .tx{font-size:30px;line-height:1.3;flex:1}
.opt .bar{height:14px;border-radius:7px;background:#FF9F5A;width:0;transition:width .4s}
.opt .cn{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.swatch{width:48px;height:48px;border-radius:50%;border:4px solid transparent;cursor:pointer;box-shadow:0 0 0 2px #C8C3B4 inset}
.swatch.sel{border-color:#C2410C;box-shadow:0 0 0 3px #FFFFFF inset}
.chk{display:flex;gap:22px;align-items:center;background:#FFFFFF;border:2px solid #E2DED3;border-radius:16px;padding:18px 26px;cursor:pointer;font:inherit;text-align:left;width:100%;color:#1B2533}
.chk .bx{width:46px;height:46px;border-radius:12px;border:3px solid #9AA4B0;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff}
.chk.on{border-color:#2E8540;background:#EDF8F0}
.chk.on .bx{background:#2E8540;border-color:#2E8540}
.chk .tx{font-size:27px;line-height:1.3}
.ruled{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
textarea.ed{white-space:pre;overflow:auto}
.cgrid{line-height:28px!important}
.cgrid>div.cm:empty.hi{outline:none;background:transparent}
.kl{padding:0 10px;border-radius:6px;white-space:pre;min-height:1.5em}
.kl.hi{background:#2A3B50;outline:3px solid #FF9F5A}
.kl.dimmed{opacity:.3}
.rule{background:#FFFFFF;border:1px solid #E2DED3;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rule h3{font-size:27px;font-weight:600;color:#14202E}
.rule .good{font-family:var(--mono);font-size:22px;background:#16212E;color:#E6EDF3;border-radius:10px;padding:10px 14px;white-space:pre}
.rule .bad{font-family:var(--mono);font-size:20px;background:#2B1717;color:#FFD3CF;border-radius:10px;padding:10px 14px;white-space:pre-wrap}
</style>

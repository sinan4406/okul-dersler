<!DOCTYPE html>

<head>

    <title>Kod Çalışmaları | Code</title>
</head>
<body>
    <h1>Kod Çalışmaları</h1>
    <h2>strong etiketi kullanımı</h2>
    <p>
        <code>&lt;strong&gt;burada metin olacak&lt;/strong&gt;</code>
    </p>
    <h2>h2 ve p etiketleri birlikte kullanımı</h2>
    <pre><code>&lt;h2&gt;Burası başlık&lt;/h2&gt;
&lt;p&gt;Burası paragraf metni&lt;/p&gt;</code></pre>
</body>
</html>

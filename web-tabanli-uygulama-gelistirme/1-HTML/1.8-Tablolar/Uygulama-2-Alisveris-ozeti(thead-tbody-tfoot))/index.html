<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablolar</title>
</head>
<body>
    <header>
        <h1>Samsun Kırtasiye</h1>
    </header>
    <main>
        <table>
            <caption>1403 numaralı sipariş özeti</caption>
            <thead>
                <tr>
                    <th scope="col">Ürün</th>
                    <th scope="col">Adet</th>
                    <th scope="col">Tutar</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Tükenmez Kalem</td>
                    <td>6</td>
                    <td>350 TL</td>
                </tr>
                <tr>
                    <td>Evrak Dosyası</td>
                    <td>10</td>
                    <td>700 TL</td>
                </tr>
                <tr>
                    <td>Silgi</td>
                    <td>5</td>
                    <td>200 TL</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row">Genel Toplam</th>
                    <td>21</td>
                    <td>1250 TL</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>
</html>

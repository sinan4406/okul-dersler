<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablolar</title>
    <style>
        table {
            border-collapse: collapse;
            text-align: center;   
        }
        th, td {
            border: 1px solid darkmagenta;
            padding: 7px;
        }
    </style>
</head>
<body>
    <header>
        <h1>SamTek Akademi</h1>
    </header>
    <main>
        <table>
            <caption>Web geliştirme grubu haftalık programı</caption>
            <thead>
                <tr>
                    <th scope="col">Saat</th>
                    <th scope="col">Pazartesi</th>
                    <th scope="col">Salı</th>
                    <th scope="col">Çarşamba</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">09:00 - 10:30</th>
                    <td>HTML</td>
                    <td>CSS</td>
                    <td>JavaScript</td>
                </tr>
                <tr>
                    <th scope="row">10:45 - 12:15</th>
                    <td>HTML Uygulaması</td>
                    <td>CSS Uygulaması</td>
                    <td>JavaScript Uygulaması</td>
                </tr>
                <tr>
                    <th scope="row">12:15 - 13:00</th>
                    <td colspan="3">Öğle Arası</td>
                </tr>
                <tr>
                    <th scope="row">13:00 - 14:30</th>
                    <td>Proje Çalışması</td>
                    <td>Proje Çalışması</td>
                    <td>Proje Değerlendirmesi</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>

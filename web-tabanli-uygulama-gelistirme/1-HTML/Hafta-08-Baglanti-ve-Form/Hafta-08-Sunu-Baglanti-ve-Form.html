<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hafta 8 - Bağlantılar ve Formlar</title>
<style>
:root{
  --bg:#f4f5ff;--panel:#ffffff;--panel2:#eceefb;--text:#0e1230;--muted:#434a6d;--line:#c9cfea;
  --accent:#5b36f2;--accent2:#00a3c4;--pink:#e8337f;--ok:#0b8a45;--bad:#d63a3f;--warn:#c76a00;
  --grad:linear-gradient(135deg,#5b36f2 0%,#9a3cf0 55%,#f0407f 100%);
  --code-bg:#ffffff;--c-tag:#c2185b;--c-attr:#1550d0;--c-str:#0a7a3e;--c-com:#6b7390;--c-css:#a35a00;--c-text:#0e1230;
}
:root[data-theme="dark"]{
  --bg:#090c1c;--panel:#141935;--panel2:#1d2348;--text:#ffffff;--muted:#c3c9ea;--line:#38417a;
  --accent:#a592ff;--accent2:#3cd8f5;--pink:#ff7ab0;--ok:#55e08f;--bad:#ff8085;--warn:#ffc04d;
  --grad:linear-gradient(135deg,#7a5cff 0%,#b05cff 55%,#ff6fae 100%);
  --code-bg:#0e1229;--c-tag:#ff86bd;--c-attr:#86bcff;--c-str:#7ef0a8;--c-com:#8c96bb;--c-css:#ffbf66;--c-text:#ffffff;
}
*{box-sizing:border-box}
html{font-size:clamp(16px,min(1.6vw,2.9vh),36px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,textarea{font-family:"JetBrains Mono","Cascadia Code",ui-monospace,Consolas,monospace}

#prog{position:fixed;top:0;left:0;height:.6vh;min-height:5px;background:var(--grad);width:0;z-index:50;transition:width .4s}
#stage{position:fixed;inset:0 0 9vh 0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.3vh;padding:2.4vh 3vw 1vh;opacity:0;visibility:hidden;transform:translateX(5vw);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1),visibility .4s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.past{transform:translateX(-5vw)}
@media(max-aspect-ratio:1/1){.slide{overflow-y:auto}}
.mod{align-self:flex-start;font-size:.55rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:.15em .8em;border-radius:99px}
.h{font-size:1.75rem;font-weight:800;line-height:1.12;letter-spacing:-.01em;margin:0}
.say{font-size:1.05rem;margin:0;font-weight:500}
.bn{font-size:.95rem;margin:0;color:var(--muted)}
.bn b{color:var(--pink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.4vh}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* kapak / bölüm */
.slide.hero,.slide.sec{background:var(--grad);color:#fff;justify-content:center;align-items:flex-start;padding:6vh 6vw;gap:2.5vh}
.slide.hero .h,.slide.sec .h{font-size:2.6rem;color:#fff}
.slide.hero .say,.slide.sec .say{font-size:1.3rem;color:#ffffffe6}
.slide.sec .big{font-size:5rem;line-height:1}
.slide.hero .mod,.slide.sec .mod{background:#ffffff30;color:#fff}

/* kod + sonuç */
.cr{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.cr.one{grid-template-columns:1fr}.cr.one .pane pre{font-size:1.1rem}
@media(max-aspect-ratio:1/1){.cr{grid-template-columns:1fr}.slide{overflow-y:auto}.cr{flex:none}.pane{min-height:35vh}}
.col{display:flex;flex-direction:column;gap:1vh;min-height:0;min-width:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;border:2px solid var(--line);border-radius:1rem;overflow:hidden;background:var(--code-bg);flex:1}
.pane.code{flex:none;max-height:100%}
.col .pane.code{flex:0 1 auto}
.pane-h{display:flex;justify-content:space-between;align-items:center;font-size:.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--panel2);padding:.25em .9em;border-bottom:2px solid var(--line)}
.pane pre{margin:0;padding:.5em .8em;font-size:.82rem;line-height:1.5;color:var(--c-text);overflow:auto;white-space:pre;flex:1;min-height:0}
.pane iframe{border:0;width:100%;flex:1;min-height:0;background:#fff}
.pane textarea{flex:1;min-height:0;border:0;outline:0;resize:none;padding:.5em .8em;font-size:.82rem;line-height:1.5;background:var(--code-bg);color:var(--c-text)}
.cp{border:2px solid var(--line);background:var(--panel);border-radius:.5em;padding:0 .6em;font-size:.5rem;text-transform:none;letter-spacing:0}
.cp.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.t-tag{color:var(--c-tag);font-weight:800}.t-attr{color:var(--c-attr);font-weight:600}.t-str{color:var(--c-str);font-weight:600}.t-com{color:var(--c-com);font-style:italic}.t-pun{color:var(--c-com)}.t-cssp{color:var(--c-css)}
.reg{background:rgba(245,158,11,.22);border-left:.25em solid #f59e0b;margin-left:-.8em;padding-left:.55em}
.hot{background:#ffd43b;color:#14142b!important;border-radius:.2em;box-shadow:0 0 0 .1em #ffd43b;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .22em #ffd43b66}}
.balloon{align-self:flex-start;position:relative;background:#ffd43b;color:#14142b;border-radius:1rem;padding:.3em 1em;font-size:.95rem;font-weight:800;margin-top:.5em}
.balloon::before{content:"";position:absolute;top:-.4em;left:1.4em;border:.45em solid transparent;border-top:0;border-bottom:.45em solid #ffd43b}
.lbl{font-size:.8rem;font-weight:800;padding:.1em .8em;border-radius:99px;align-self:flex-start}
.lbl.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.lbl.neu{background:var(--panel2);color:var(--accent)}
.lbl.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* kontroller */
.ctrls{display:flex;flex-wrap:wrap;gap:1vh 1.6vw;align-items:center;font-size:.8rem}
.ctrls label{display:inline-flex;align-items:center;gap:.4em}
.ctrls input[type=checkbox]{width:1em;height:1em;accent-color:var(--accent)}
.ctrls input[type=range]{accent-color:var(--accent);width:10em}
.ctrls input[type=text],.ctrls select{font-size:.75rem;padding:.1em .5em;border:2px solid var(--line);border-radius:.5em;background:var(--panel);color:var(--text)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:.8em;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:.2em .9em;border-right:2px solid var(--line);font-size:.8rem}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--grad);color:#fff;font-weight:800}
.pane-h .seg button{font-size:.55rem;padding:0 .7em;text-transform:none;letter-spacing:0}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:.8em;padding:.2em .9em;font-size:.8rem}
.btn.pri{background:var(--grad);color:#fff;border:0;font-weight:800}

/* fikir / liste / seçim kartları */
.cards{flex:1;min-height:0;display:grid;gap:2vw;grid-template-columns:repeat(var(--n,3),1fr);align-items:stretch}
.card{background:var(--panel);border:2px solid var(--line);border-radius:1.2rem;padding:1.5vh 1.4vw;display:flex;flex-direction:column;justify-content:center;gap:.6vh;text-align:center}
.card .em{font-size:5rem;line-height:1}
.card b{font-size:1.5rem}
.card span{font-size:1.1rem;color:var(--muted)}
.card code{font-size:1.5rem;color:var(--c-tag);font-weight:800}
.list{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vh}
.list .it{display:flex;align-items:center;gap:1.2vw;font-size:1.15rem;font-weight:600;background:var(--panel);border:2px solid var(--line);border-radius:1.2rem;padding:1.2vh 1.5vw}
.list .it .em{font-size:2rem}
.list.bad .it{border-left:.5rem solid var(--bad)}.list.good .it{border-left:.5rem solid var(--ok)}
code.i{background:var(--panel2);padding:0 .3em;border-radius:.3em;border:1px solid var(--line);color:var(--c-tag);font-weight:700}

/* sayfa haritası */
.pmap{flex:1;min-height:0;display:grid;gap:.6vh;grid-template-columns:1fr 14vw;grid-template-rows:auto auto 1fr auto;grid-template-areas:"hd hd" "nv nv" "mn sd" "ft ft";padding:.8vh;background:var(--panel2);border-radius:1rem;border:2px solid var(--line)}
.pmap .z{border:3px dashed var(--line);border-radius:.8rem;padding:.3em .8em;font-weight:800;font-size:.9rem;opacity:.15;transform:scale(.96);transition:all .5s;display:flex;align-items:center}
.pmap .z.show{opacity:1;transform:none;border-style:solid}
.z-hd{grid-area:hd;background:#ffe3d6;color:#7c2d12}.z-nv{grid-area:nv;background:#dbe9ff;color:#1e3a8a}.z-mn{grid-area:mn;background:#d9f5de;color:#14532d;flex-wrap:wrap;gap:.5em}.z-sd{grid-area:sd;background:#fff1bd;color:#713f12}.z-ft{grid-area:ft;background:#e7d8ff;color:#4c1d95}
.pmap.soup .z{background:var(--panel);color:var(--text);border-color:var(--muted)}
.pmap .z.hl{outline:4px solid var(--accent)}
.mn-in{display:flex;gap:.5em;width:100%}
.mn-in span{flex:1;border:3px dashed #2f855a;border-radius:.6rem;padding:0 .5em;font-size:.8rem;background:#ffffffaa;color:#14532d;opacity:.15;transition:opacity .5s}
.pmap.soup .mn-in span{background:var(--panel);color:var(--text);border-color:var(--muted)}

.tree{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:1vh 1vw;overflow:auto;min-height:0}
.tree div{padding:.05em .5em;border-radius:.4em;white-space:nowrap}
.tree .f{cursor:pointer}.tree .f:hover{background:var(--panel2)}
.tree .from{background:#ffd2bd;color:#7c2d12;font-weight:800}.tree .to{background:#bfeccf;color:#14532d;font-weight:800}
.pathout{font-size:.9rem;padding:.5em .8em;background:var(--code-bg);border:2px solid var(--line);border-radius:1rem;overflow:auto}
.bars{display:grid;gap:.8vh;font-size:.7rem}
.bars .row{display:flex;align-items:center;gap:.6em}
.bars .lab{width:11em;flex:none}
.bars .bg{flex:1;height:.9em;background:var(--panel2);border-radius:.5em;overflow:hidden;border:1px solid var(--line)}
.bars .fill{display:block;height:100%;background:var(--muted)}
.bars .row.pick .fill{background:var(--ok)}.bars .row.pick .lab{font-weight:800;color:var(--ok)}
.vp{border:3px solid var(--muted);border-radius:1rem;background:var(--panel2);padding:.4em;text-align:center;font-weight:800;font-size:.75rem;transition:width .15s;max-width:100%}
.mediabox{flex:1;display:grid;place-items:center;background:var(--panel2);text-align:center;padding:.5em;min-height:0}
.mediabox video,.mediabox audio{max-width:100%;max-height:100%;border-radius:.6em}
.hintw{font-size:.6rem;color:var(--warn);font-weight:700}

/* uygulama ara slaytları */
.slide.app{background:linear-gradient(135deg,#0f766e 0%,#0891b2 55%,#2563eb 100%);color:#fff;border-top:.6vh dashed #fde047}
.slide.app .h{color:#fff}.slide.app .mod{background:#ffffff30;color:#fff}
.slide.app .body{flex:1;justify-content:center}
.appbox{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
@media(max-aspect-ratio:1/1){.appbox{grid-template-columns:1fr}}
.appbox .c{background:#ffffff1f;border:2px solid #ffffff66;border-radius:1rem;padding:1.2vh 1.2vw;font-size:.95rem}
.appbox h3{margin:0 0 .3em;font-size:1rem;color:#fde047}.appbox p{margin:0 0 .6em}.appbox ul{margin:0;padding-left:1.2em}.appbox code{color:#fff;font-weight:800}
.appbtn{align-self:flex-start;background:#fde047;color:#14142b;font-weight:800;font-size:1.05rem;padding:.4em 1.4em;border-radius:1rem;text-decoration:none}
/* alt çubuk */
#bottom{position:fixed;inset:auto 0 0 0;height:9vh;display:flex;align-items:center;justify-content:space-between;gap:1vw;padding:0 2vw;background:var(--panel);border-top:2px solid var(--line);z-index:40}
.nbtn{background:var(--grad);color:#fff;border:0;border-radius:1rem;padding:.25em 1.6em;font-weight:800;font-size:1rem;min-width:7em;height:75%}
.nbtn:disabled{opacity:.3}
.sbtn{border:2px solid var(--line);background:var(--panel2);border-radius:1rem;padding:.25em .8em;font-size:.85rem;height:75%}
#counter{font-size:.9rem;font-weight:700;color:var(--muted);min-width:5em;text-align:center}
.mid{display:flex;align-items:center;gap:1vw;flex:1;justify-content:center}
.drawer{position:fixed;top:0;bottom:9vh;left:0;width:min(30rem,92vw);background:var(--panel);border-right:2px solid var(--line);z-index:60;overflow:auto;padding:1vh 1vw;transform:translateX(-105%);transition:transform .3s}
.drawer.open{transform:none}
.mi{display:flex;gap:.6em;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.25em .3em;font-size:.65rem}
.mi:hover{background:var(--panel2)}.mi.cur{background:var(--panel2);font-weight:800;color:var(--accent)}
.mi .n{width:2em;color:var(--muted)}
.mh{font-size:.55rem;font-weight:800;text-transform:uppercase;color:var(--muted);margin:.8em 0 .1em}
@media(prefers-reduced-motion:reduce){.slide{transition:none}.hot{animation:none}}

.try{flex:none;background:color-mix(in srgb,var(--warn) 16%,var(--panel));border:2px solid var(--warn);border-radius:1rem;padding:.35em 1em;font-size:.85rem}
.flow{flex:1;min-height:0;position:relative;display:flex;justify-content:space-between;align-items:stretch;padding:1.5vh 2vw;background:var(--panel2);border:2px solid var(--line);border-radius:1rem}
.fbox{width:34%;background:var(--panel);border:3px solid var(--line);border-radius:1rem;padding:.5em .8em;transition:border-color .4s,box-shadow .4s;overflow:auto}
.fbox.act{border-color:var(--accent);box-shadow:0 0 0 .25em color-mix(in srgb,var(--accent) 25%,transparent)}
.fbox h4{margin:0 0 .3em;font-size:.8rem;color:var(--accent)}
.fbox .fl,.fbox .fr{font-size:.85rem}
.fpk{position:absolute;top:50%;left:18%;transform:translate(-50%,-50%);background:#ffd43b;color:#14142b;border-radius:.8rem;padding:.25em .8em;font-weight:800;font-size:.8rem;transition:left 1s ease,opacity .4s;white-space:nowrap;box-shadow:0 3px 10px #0004;z-index:2}
.fcap{flex:none;font-size:1rem;background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:.4em 1em}
.addr{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;padding:.5em .8em;overflow:auto;word-break:break-all}
.addr mark{background:#ffd43b;color:#14142b;border-radius:.2em;padding:0 .2em}
.why{font-size:.85rem;background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:.4em .9em}
.hintbox{flex:none;font-size:.9rem;background:var(--panel);border:2px solid var(--accent);border-radius:1rem;padding:.3em 1em}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"></div>
<div id="menu" class="drawer"></div>
<div id="bottom">
  <button class="sbtn" id="bMenu" title="Slayt listesi (M)">&#9776;</button>
  <div class="mid">
    <button class="nbtn" id="prev">&larr; Geri</button>
    <div id="counter"></div>
    <button class="nbtn" id="next">İleri &rarr;</button>
  </div>
  <button class="sbtn" id="bTheme" title="Tema (T)">&#9680;</button>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escA(s){return esc(s).replace(/"/g,'&quot;')}
const TIMERS=[];
function clearTimers(){while(TIMERS.length)clearInterval(TIMERS.pop())}

/* ---------- kod renklendirme ---------- */
function hlCSS(css){
  return esc(css).replace(/([^{}]+)\{([^{}]*)\}/g,(m,sel,body)=>'<span class="t-tag">'+sel+'</span>{'+body.replace(/([a-z-]+)(\s*:\s*)([^;]+)(;?)/g,(x,p,c,v,s)=>'<span class="t-cssp tk" data-k="c:'+p+'">'+p+'</span>'+c+'<span class="t-str">'+v+'</span>'+s)+'}');
}
function hl2(code){
  const parts=[];let i=0;
  const re=/(<!--[\s\S]*?-->)|<(\/?)([a-zA-Z][\w-]*)((?:[^>"']|"[^"]*"|'[^']*')*)>/g;let m;
  while((m=re.exec(code))){
    parts.push(esc(code.slice(i,m.index)));
    if(m[1]){parts.push('<span class="t-com">'+esc(m[1])+'</span>');i=re.lastIndex;continue}
    let a=m[4],self='';
    if(/\/\s*$/.test(a)){self='/';a=a.replace(/\/\s*$/,'')}
    const nm=m[3].toLowerCase();
    const at=a.replace(/([^\s=]+)(?:(=)("[^"]*"|'[^']*'|[^\s]+))?/g,(x,n,e,v)=>'<span class="t-attr tk" data-k="a:'+escA(n)+'">'+esc(n)+'</span>'+(v?'<span class="t-pun">'+esc(e)+'</span><span class="t-str tk" data-k="a:'+escA(n)+'">'+esc(v)+'</span>':''));
    parts.push('<span class="t-pun">&lt;'+esc(m[2])+'</span><span class="t-tag tk" data-k="t:'+nm+'">'+m[3]+'</span>'+at+'<span class="t-pun">'+self+'&gt;</span>');
    i=re.lastIndex;
    if(nm==='style'&&!m[2]){const e=code.indexOf('</style>',i);if(e>-1){parts.push(hlCSS(code.slice(i,e)));i=e;re.lastIndex=e}}
  }
  parts.push(esc(code.slice(i)));
  return parts.join('');
}
function copyText(t,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='Kopyalandı';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok')},1200)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}
}

/* ---------- sonuç penceresi ---------- */
function pageCss(mode,fs){
  const base=`body{font:${fs}vw/1.4 system-ui,"Segoe UI",Arial,sans-serif;margin:0;color:#14183a;background:#fff;scroll-behavior:smooth}img{max-width:100%}`+
  `label{display:block;font-weight:700;margin:.35em 0 .1em}input,select,textarea,button{font:inherit;padding:.15em .4em;margin:.1em 0;max-width:100%}input[type=checkbox],input[type=radio]{padding:0;margin:.1em .4em .1em 0}label>input{font-weight:400}`+
  `button{background:#6d4aff;color:#fff;border:0;border-radius:.4em;padding:.25em .9em;font-weight:700;cursor:pointer}button[type=reset]{background:#6b7390}`+
  `fieldset{border:1px solid #aab2d6;border-radius:.5em;margin:.4em 0;padding:.2em .7em}legend{font-weight:800;color:#5b36f2;padding:0 .3em}`+
  `a.dugme,button.dugme{display:inline-block;background:#6d4aff;color:#fff;padding:.25em .9em;border-radius:.5em;border:0;text-decoration:none;font:inherit;font-weight:700}`+
  `:target{background:#fff3b0!important}.sol{color:#8a90ab;font-weight:400}`;
  if(mode==='plain')return '<style>'+base+'body{margin:.5em}h2{margin:.15em 0;font-size:1.3em}p{margin:.15em 0}a{color:#5b36f2}</style>';
  return '<style>'+base+`body{background:#f3f4fb}header,.ust{background:linear-gradient(135deg,#6d4aff,#a14bff);color:#fff;padding:.4em .8em}header h1{margin:0;font-size:1.4em;font-weight:800}header p{margin:0}nav{background:#fff;padding:.3em .8em;border-bottom:1px solid #e2e6f3}nav a{margin-right:.7em}a{color:#6d4aff;font-weight:700}main{display:block;padding:.2em .6em}section,article,details,.kart{background:#fff;border-radius:.5em;padding:.3em .7em;margin:.3em 0;box-shadow:0 1px 5px #0002}h2,h3{margin:.1em 0;font-size:1.15em}p{margin:.1em 0}aside{background:#fff4c9;margin:.3em .6em;padding:.3em .7em;border-radius:.5em}footer{background:#232846;color:#cfd4ef;padding:.4em .8em;font-size:.85em}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:.1em .5em}</style>`;
}
const RUN_JS='<script>(function(){'+
 'var t;function toast(m){var d=document.getElementById("__t");if(!d){d=document.createElement("div");d.id="__t";d.style.cssText="position:fixed;left:.4em;right:.4em;bottom:.4em;background:#232846;color:#fff;padding:.4em .7em;border-radius:.5em;font:700 12px/1.3 system-ui,Arial;z-index:9;box-shadow:0 2px 8px #0006";document.body.appendChild(d)}d.textContent=m;d.style.display="block";clearTimeout(t);t=setTimeout(function(){d.style.display="none"},3500)}'+

/* "Özellik yok / var" önce-sonra düğmesi */
function ctl(html){const d=document.createElement('div');d.className='ctrls';d.innerHTML=html;return d}
function offSeg(host,before,apply){
  const c=ctl('<div class="seg"><button data-v="0">Özellik yok</button><button data-v="1" class="on">Özellik var</button></div>');
  host.insertBefore(c,before||null);
  $$('button',c).forEach(x=>x.onclick=()=>{$$('button',c).forEach(y=>y.classList.remove('on'));x.classList.add('on');apply(x.dataset.v==='1')});
}

/* ---------- kod/sonuç parçaları ---------- */
function mkPane(code,o){
  o=o||{};
  const p=document.createElement('div');p.className='pane code';
  p.innerHTML='<div class="pane-h"><span>'+esc(o.name||'Kod')+'</span><button class="cp">Kopyala</button></div>';
  const pre=document.createElement('pre');p.appendChild(pre);
  const ta=document.createElement('textarea');ta.spellcheck=false;ta.style.display='none';p.appendChild(ta);
  let cur=code,edit=false,onChange=null;
  /* o.band: {s:'başlangıç satırı regex', e:'bitiş satırı regex (yoksa tek satır)'} ya da dizi */
  const bands=()=>{const L=cur.split('\n'),R=[];
    [].concat(o.band||[]).forEach(b=>{const rs=new RegExp(b.s);const a=L.findIndex(l=>rs.test(l));if(a<0)return;let z=a;
      if(b.e){const re=new RegExp(b.e);for(let j=a;j<L.length;j++)if(re.test(L[j])){z=j;break}}
      R.push([a,z])});
    return R};
  const render=()=>{let h=hl2(cur);
    const R=bands();
    if(R.length){const Ls=h.split('\n');h=Ls.map((l,i)=>R.some(r=>i>=r[0]&&i<=r[1])?'<span class="reg" style="display:block">'+(l||' ')+'</span>':l+(i<Ls.length-1?'\n':'')).join('')}
    pre.innerHTML=h;(o.hl||[]).forEach(k=>$$('.tk[data-k="'+k+'"]',pre).forEach(x=>x.classList.add('hot')));
    const r=$('.reg',pre);if(r)pre.scrollTop=Math.max(0,r.offsetTop-pre.clientHeight/3)};
  render();
  $('.cp',p).onclick=e=>copyText(cur,e.target);
  if(o.edit){
    const b=document.createElement('button');b.className='cp';b.textContent='✎ Düzenle';$('.pane-h',p).insertBefore(b,$('.cp',p));
    b.onclick=()=>{edit=!edit;if(edit){ta.value=cur;ta.style.display='block';pre.style.display='none';b.textContent='✓ Bitti'}else{cur=ta.value;ta.style.display='none';pre.style.display='block';b.textContent='✎ Düzenle';render();onChange&&onChange(cur)}};
    ta.addEventListener('input',()=>{cur=ta.value;onChange&&onChange(cur)});
  }
  return {el:p,set(c,h){cur=c;if(h)o.hl=h;render()},get:()=>cur,onChange(f){onChange=f}};
}
function mkRes(code,o){
  o=o||{};
  const p=document.createElement('div');p.className='pane';
  p.innerHTML='<div class="pane-h"><span>Sonuç'+(o.outline?' <small>(turuncu çerçeve = bu parça)</small>':'')+'</span></div>';
  const fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts');fr.title='Sonuç';p.appendChild(fr);
  const upd=c=>{fr.srcdoc=runDoc(c,o)};upd(code);
  return {el:p,set:upd};
}
function codeRes(host,code,o){
  o=o||{};
  const cr=document.createElement('div');cr.className='cr'+(o.run===false?' one':'');
  const left=document.createElement('div');left.className='col';
  const cp=mkPane(code,o);left.appendChild(cp.el);
  if(o.note){const b=document.createElement('div');b.className='balloon';b.innerHTML=o.note;left.appendChild(b)}
  cr.appendChild(left);
  let rs=null;
  if(o.run!==false){rs=mkRes(code,o);cr.appendChild(rs.el)}
  host.appendChild(cr);
  if(o.edit&&rs)cp.onChange(c=>rs.set(c));
  if(o.off&&rs)offSeg(host,cr,on=>{const c=on?code:code.replace(new RegExp(o.off,'g'),'');cp.set(c,on?o.hl:[]);rs.set(c)});
  return {set(c,h){cp.set(c,h);if(rs)rs.set(c)},cp,rs};
}

add({t:'sec',mod:MODB,em:'📝',h:'B. Formlar',say:'form = ziyaretçiden bilgi alan sayfa parçası'});
add({t:'cards',mod:MODB,h:'Form nedir?',n:3,items:[['📄','Kâğıt başvuru formu','Okul kayıt kâğıdı gibi: boşlukları doldurursun, teslim edersin.'],['🌐','Webde her yerde','Giriş yap, arama kutusu, sipariş, üyelik, anket: hepsi formdur.'],['🧩','Dört ana parça','<code>form</code> kutuyu, <code>label</code> adı, <code>input</code> kutucuğu, <code>button</code> göndermeyi yapar.']],say:'Bugüne kadar sayfalar sadece <b>gösteriyordu</b>. Formla sayfa ziyaretçiden bilgi <b>alır</b>.'});
add({t:'demo',mod:MODB,h:'Form gönderilince ne olur?',say:'Oynat ve izle. Duraklatıp adım adım da ilerleyebilirsin.',build:'flow',cfg:'form'});
tg(MODB,'&lt;form&gt; = bilgi toplayan zarf','<b>form</b> (form – "form"), içindeki alanları toplayıp bir adrese yollayan kutudur. Olmazsa alanlar ekranda durur ama hiçbiri bir yere gitmez. <b>action</b> = bilginin gideceği adres, <b>method</b> = gönderme biçimi. <b>Fark:</b> div de gruplar ama göndermez.','✉️ <b>Benzetme:</b> zarf. İçine mektupları (alanları) koyarsın, üstüne adres (action) yazarsın, postaya (method) verirsin.',
  FP(L_AD+'\n'+BTN),{band:{s:'<form',e:'</form>'},sel:'form',hl:['t:form'],note:'form = alanları toplayıp gönderen zarf',edit:true,try:'Kutuya <b>Ali</b> yaz, Gönder\'e bas. Yeşil satır, tarayıcının sunucuya yollayacağı paketi gösterir. (Burada gerçek sunucu yok; paket gösterilir.)'});
add({t:'demo',mod:MODB,h:'method: GET mi, POST mu?',say:'Kutuları doldur, GET ve POST arasında geç. Bilginin nerede göründüğüne bak.',build:'getpost'});
tg(MODB,'&lt;label&gt; = alanın adı','<b>label</b> (leybıl – etiket) kutunun ne için olduğunu yazar. <b>for</b>, label ile kutuyu bağlar: label\'daki for değeri, kutunun <b>id</b> değeriyle aynı olur. Olmazsa kutuya yalnızca dokunmak gerekir (küçük kutuya parmakla basmak zor) ve ekran okuyucu "boş kutu" der.','🏷️ <b>Benzetme:</b> çekmecenin üstündeki yazı: "Çorap". Yazıya da dokunsan çekmece açılır.',
  FP(L_AD+'\n'+BTN),{band:{s:'<label',e:'<input'},sel:'label,#ad',hl:['t:label','a:for'],off:' for="ad"',note:'label for="ad" ↔ input id="ad"',edit:true,try:'"Adın" yazısına tıkla: imleç kutuya geçer. "Özellik yok"ta (for kalkınca) aynı tıklama kutuya geçmez.'});
tg(MODB,'&lt;input&gt;: bilgi kutusu, name: paketin etiketi','<b>input</b> (inpıt – girdi) ziyaretçinin bilgi yazdığı kutudur; <b>type</b> kutunun türünü söyler. <b>id</b> label ile bağlamak içindir (sayfa içi kimlik). <b>name</b> sunucuya giden paketteki <b>adı</b> yazar: ad=Ali. <b>name yoksa o alan hiç gönderilmez.</b>','📦 <b>Benzetme:</b> kargo kolisinin üstündeki "Ad: Ali" etiketi. Etiketsiz koliyi kimse teslim almaz.',
  FP(L_AD+'\n'+BTN),{band:{s:'<input'},sel:'#ad',hl:['t:input','a:name','a:id'],off:' name="ad"',note:'name = sunucuya giden ad',edit:true,try:'Kutuya Ali yaz, Gönder\'e bas: <b>ad=Ali</b>. Sonra "Özellik yok"a bas (name kalkar), tekrar dene: paket <b>boş</b> gider.'});
add({t:'demo',mod:MODB,h:'input türleri: type değiştikçe kutu değişir',say:'Bir tür seç; kodu ve sonucu izle. Kutuya bir şey yaz, Gönder\'e bas.',build:'type'});
tg(MODB,'placeholder = silinen ipucu','<b>placeholder</b> (pleysholder – yer tutucu) kutunun içinde soluk yazan örnektir; yazmaya başlayınca kaybolur. Olmazsa ziyaretçi kutuya ne yazacağını (örn. soyad da mı?) bilemez. Ancak label\'ın <b>yerine geçmez</b>.','📝 <b>Benzetme:</b> kâğıttaki kurşun kalemle yazılmış örnek. Üstüne yazınca silinir.',
  FP(L_AD.replace('name="ad">','name="ad" placeholder="Örn. Ayşe Yılmaz">')+'\n'+BTN),{band:{s:'placeholder'},sel:'#ad',hl:['a:placeholder'],off:' placeholder="[^"]*"',note:'placeholder = örnek yazı',edit:true,try:'Kutuya bir harf yaz: soluk yazı kaybolur. Placeholder metnini kendi adınla değiştir.'});
add({t:'cmp',mod:MODB,h:'label mı, placeholder mı? Gözle benzer, anlamı farklı',say:'Placeholder yazmaya başlayınca <b>kaybolur</b>; ziyaretçi neyi doldurduğunu unutur. Ekran okuyucular da placeholder\'ı güvenilir okumaz. Kalıcı ad için <b>label</b>; ek örnek için placeholder.',
  a:{lbl:'label = kalıcı ad',cls:'good',code:'<form>\n  <label for="ad">Adın</label>\n  <input type="text" id="ad" name="ad">\n</form>'},
  b:{lbl:'sadece placeholder: ad kaybolur',cls:'bad',code:'<form>\n  <input type="text" name="ad"\n         placeholder="Adın">\n</form>'}});
tg(MODB,'required = boş bırakılamaz','<b>required</b> (rikvayırd – zorunlu) alanın doldurulmasını şart koşar. Olmazsa 100 kişiden 20\'si adını boş yollar, elinde adsız kayıtlar kalır. Tarayıcı boşsa formu göndermez ve uyarı gösterir.','🚧 <b>Benzetme:</b> kapıdaki bilet kontrolü: bileti göstermeyen içeri giremez.',
  FP('      <label for="mail">E-posta</label>\n      <input type="email" id="mail" name="mail" required>\n'+BTN),{band:{s:'<input'},sel:'#mail',hl:['a:required'],off:' required',note:'required = zorunlu',edit:true,try:'Kutuyu boş bırakıp Gönder\'e bas: tarayıcı uyarır. "Özellik yok"ta aynısını yap: boş paket gider. Sonra "a" yaz (e-posta değil): yine uyarır, çünkü <code class="i">type="email"</code> biçimi de denetler.'});
tg(MODB,'minlength, maxlength, min, max = sınırlar','<b>minlength / maxlength</b> yazının en az-en çok harf sayısını, <b>min / max</b> sayının en küçük-en büyük değerini belirler. Olmazsa yaş kutusuna 300 ya da ad kutusuna tek harf girilebilir. Sınırı aşarsa tarayıcı uyarır.','📏 <b>Benzetme:</b> lunaparktaki boy sınırı: çok kısa ya da çok uzun giremez.',
  FP('      <label for="ad">Adın (3-20 harf)</label>\n      <input type="text" id="ad" name="ad" minlength="3" maxlength="20">\n      <label for="yas">Yaşın (9-18)</label>\n      <input type="number" id="yas" name="yas" min="9" max="18">\n'+BTN),{band:[{s:'type="text"'},{s:'type="number"'}],sel:'#ad,#yas',hl:['a:minlength','a:maxlength','a:min','a:max'],off:' min="9" max="18"| minlength="3" maxlength="20"',note:'sınırlar: en az / en çok',edit:true,try:'Adına "Al" (2 harf), yaşına 30 yaz, Gönder\'e bas: iki uyarı da gelir. Sonra "Özellik yok"ta tekrar dene.'});
add({t:'app',mod:MODB,n:2,h:'🛠️ Uygulama 2: Kulüp Kayıt Formu',know:[['form, label, input, placeholder, required','B bölümü: bu hafta'],['a, #id (menüden forma git)','A bölümü: bu hafta'],['header, nav, main, section, footer','Hafta 7'],['h1, h2, p','Hafta 4-5'],['html, head, title, lang','Hafta 3-4']],goal:'Bitmiş kayıt formu sayfasını incele, aynısını baştan yaz: ad ve e-posta kutuları label ile bağlanacak, zorunlu alanlar işaretlenecek, Gönder düğmesi olacak.',time:'15 dakika'});

/* ===== C. FORMLAR: SEÇENEKLER VE GÖNDERME ===== */
add({t:'sec',mod:MODC,em:'☑️',h:'C. Seçenekler ve gönderme',say:'checkbox, radio, select, textarea, button'});
tg(MODC,'checkbox = birden çok seçim (kutucuk)','<b>checkbox</b> (çekboks – onay kutusu) kutucuğu istediğin kadar işaretlersin. Olmazsa "hangi alanlar ilgini çekiyor?" gibi çok seçimli sorular için 5 ayrı soru yazmak gerekir. Aynı <b>name</b> ile gruplanır; işaretli olanların <b>value</b>\'ları gider. Label\'ı kutucuğun etrafına sararsan <b>for/id</b> yazmak gerekmez.','☑️ <b>Benzetme:</b> alışveriş listesi: istediğin maddelerin yanına tik atarsın.',
  FP('      <p>İlgi alanların:</p>\n      <label><input type="checkbox" name="ilgi" value="robot"> Robotik</label>\n      <label><input type="checkbox" name="ilgi" value="yazilim"> Yazılım</label>\n'+BTN),{band:{s:'name="ilgi" value="robot"',e:'value="yazilim"'},sel:'input[type=checkbox]',hl:['a:type','a:value'],note:'checkbox = çoklu seçim',edit:true,try:'İkisini de işaretle, Gönder\'e bas: ilgi=robot&ilgi=yazilim. Hiçbirini işaretlemezsen paket boş gider.'});
tg(MODC,'radio = yalnızca bir seçim (yuvarlak)','<b>radio</b> (reydiyo – seçenek düğmesi) gruptan <b>yalnızca birini</b> seçtirir. Aynı gruptaki düğmelerin <b>name</b> değeri <b>aynı</b> olmak zorundadır; tarayıcı bu sayede birini seçince diğerini kapatır. name farklıysa hepsi ayrı bir grup olur.','📻 <b>Benzetme:</b> eski radyonun tuşları: birine basınca diğeri yukarı çıkar.',
  FP('      <p>Seviyen:</p>\n      <label><input type="radio" name="seviye" value="yeni"> Yeni başlıyorum</label>\n      <label><input type="radio" name="seviye" value="orta"> Biraz biliyorum</label>\n'+BTN),{band:{s:'name="seviye" value="yeni"',e:'value="orta"'},sel:'input[type=radio]',hl:['a:name'],off:' name="seviye"',note:'aynı name = tek seçim',edit:true,try:'İki düğmeyi sırayla seç: biri kapanır. "Özellik yok"ta (name kalkar) aynısını yap: ikisi birden seçilir, üstelik paket boş gider.'});
add({t:'cmp',mod:MODC,h:'checkbox mı, radio mu?',say:'Gözle ikisi de küçük bir işaret kutusu. Fark: <b>kare = çok seçim</b> (istediğini işaretle), <b>yuvarlak = tek seçim</b> (biri kalır). Kural: "birden çok olabilir mi?" Olabilirse checkbox.',
  a:{lbl:'checkbox: birden çok olabilir',cls:'neu',code:'<p>Hangi dersleri seviyorsun?</p>\n<label><input type="checkbox" name="ders" value="mat"> Matematik</label>\n<label><input type="checkbox" name="ders" value="fen"> Fen</label>'},
  b:{lbl:'radio: yalnızca biri',cls:'neu',code:'<p>Hangi sınıftasın?</p>\n<label><input type="radio" name="sinif" value="9"> 9. sınıf</label>\n<label><input type="radio" name="sinif" value="10"> 10. sınıf</label>'}});
tg(MODC,'&lt;select&gt; = açılır liste','<b>select</b> (silekt – seçim) açılır listedir; her satırı bir <b>option</b> (opşın – seçenek) etiketi yazar. Olmazsa 40 şehri radio ile alt alta dizmek gerekir ve sayfa uzar. <b>value</b> sunucuya giden değerdir, option\'ın arasındaki yazı ise ziyaretçinin gördüğüdür.','🍽️ <b>Benzetme:</b> menüdeki içecek listesi: bir yerde durur, tıklayınca açılır.',
  FP('      <label for="sinif">Sınıfın</label>\n      <select id="sinif" name="sinif">\n        <option value="9">9. sınıf</option>\n        <option value="10">10. sınıf</option>\n        <option value="11">11. sınıf</option>\n      </select>\n'+BTN),{band:{s:'<select',e:'</select>'},sel:'select',hl:['t:select','t:option'],note:'select > option = açılır liste',edit:true,try:'10. sınıfı seç, Gönder\'e bas: <b>sinif=10</b> gider (ekranda yazan "10. sınıf" değil, value). <code class="i">value="10"</code> değerini <code class="i">value="onuncu"</code> yap ve tekrar dene.'});
add({t:'cmp',mod:MODC,h:'select mi, radio mu?',say:'İkisi de tek seçim yaptırır. Fark: <b>az seçenek (2-5)</b> varsa radio: hepsi görünür, tek dokunuş yeter. <b>Çok seçenek</b> varsa select: yer tutmaz.',
  a:{lbl:'radio: az seçenek, hepsi görünür',cls:'neu',code:'<label><input type="radio" name="g" value="k"> Kız</label>\n<label><input type="radio" name="g" value="e"> Erkek</label>'},
  b:{lbl:'select: çok seçenek, yer tutmaz',cls:'neu',code:'<label for="s">Şehir</label>\n<select id="s" name="s">\n  <option>Ankara</option>\n  <option>İzmir</option>\n  <option>Samsun</option>\n</select>'}});
tg(MODC,'&lt;textarea&gt; = çok satırlı yazı kutusu','<b>textarea</b> (tekst eria – yazı alanı) uzun yazılar içindir: mesaj, yorum, açıklama. Olmazsa tek satırlık kutuya 3 paragraf yazmak çok zordur. <b>rows</b> görünen satır sayısını belirler. input gibi tek etiket değil, <b>açılış ve kapanış</b> etiketi vardır.','🗒️ <b>Benzetme:</b> sınav kâğıdındaki açık uçlu cevap boşluğu.',
  FP('      <label for="mesaj">Mesajın</label>\n      <textarea id="mesaj" name="mesaj" rows="4"></textarea>\n'+BTN),{band:{s:'<textarea'},sel:'textarea',hl:['t:textarea','a:rows'],off:' rows="4"',note:'textarea = uzun yazı kutusu',edit:true,try:'<code class="i">rows="4"</code> değerini 8 yap: kutu uzar. Birkaç satır yazıp Enter ile yeni satıra geç ve Gönder\'e bas.'});
add({t:'cmp',mod:MODC,h:'input mı, textarea mı?',say:'Kısa, tek satırlık cevap (ad, e-posta) için <b>input</b>. Uzun, birkaç satırlık cevap (mesaj) için <b>textarea</b>. Biri kendi kendine kapanır, öbürünün kapanış etiketi vardır.',
  a:{lbl:'input: tek satır',cls:'neu',code:'<label for="konu">Konu</label>\n<input type="text" id="konu" name="konu">'},
  b:{lbl:'textarea: çok satır',cls:'neu',code:'<label for="m">Mesaj</label>\n<textarea id="m" name="m" rows="3"></textarea>'}});
tg(MODC,'&lt;button&gt; = gönder, temizle','<b>button</b> (batın – düğme) tıklanınca iş yapar. <b>type="submit"</b> formu gönderir, <b>type="reset"</b> kutuları ilk haline döndürür, <b>type="button"</b> hiçbir şey yapmaz (ileride JavaScript\'le çalışacak). Dikkat: form içinde type yazmazsan düğme gönderir.','🛎️ <b>Benzetme:</b> asansördeki "Kat seç" ve "Hepsini iptal" düğmeleri.',
  FP(L_AD+'\n      <button type="submit">Gönder</button>\n      <button type="reset">Temizle</button>'),{band:{s:'<button',e:'Temizle'},sel:'button',hl:['t:button','a:type'],note:'submit = gönder, reset = temizle',edit:true,try:'Adın yaz, Temizle\'ye bas: kutu boşalır. Sonra Gönder\'e bas ve paketi izle.'});
add({t:'cmp',mod:MODC,h:'button mı, input type="submit" mi? Gözle aynı',say:'İkisi de bir gönder düğmesi gösterir ve aynı işi yapar. Fark: <b>button</b> arasına yazı, simge, <b>kalın yazı</b> koyabilirsin; <b>input</b> yalnızca düz yazıdır. Yeni sayfalarda <b>button</b> tercih edilir.',
  a:{lbl:'button: içine etiket girer',cls:'neu',code:'<button type="submit">\n  <strong>Gönder</strong> ➜\n</button>'},
  b:{lbl:'input submit: sadece düz yazı',cls:'neu',code:'<input type="submit" value="Gönder">'}});
tg(MODC,'&lt;fieldset&gt; ve &lt;legend&gt; = alan grubu','<b>fieldset</b> (fiyldset – alan kümesi) birbiriyle ilgili alanları çerçeveye alır, <b>legend</b> (lecend – başlık) çerçevenin başlığını yazar. Olmazsa uzun formda "bu radyo düğmeleri neyin?" karışır; ekran okuyucu grubun adını okuyamaz.','🗂️ <b>Benzetme:</b> dosya klasöründeki ayraç kâğıdı: "Kişisel bilgiler".',
  FP('      <fieldset>\n        <legend>Seviyen</legend>\n        <label><input type="radio" name="seviye" value="yeni"> Yeni başlıyorum</label>\n        <label><input type="radio" name="seviye" value="orta"> Biraz biliyorum</label>\n      </fieldset>\n'+BTN),{band:{s:'<fieldset',e:'</fieldset>'},sel:'fieldset',hl:['t:fieldset','t:legend'],note:'fieldset = çerçeveli grup',edit:true,try:'<code class="i">Seviyen</code> yazısını "Deneyimin" yap. Başlık çerçevenin üstünde değişir.'});
add({t:'cmp',mod:MODC,h:'fieldset mi, div mi? Gözle benzer, anlamı farklı',say:'İkisi de alanları gruplar. <b>div</b> sadece taşıyıcıdır, anlamı yoktur. <b>fieldset</b> ise "bunlar tek bir sorunun parçaları" der ve legend ile grubun adını söyler. Radio/checkbox gruplarında fieldset kullan.',
  a:{lbl:'fieldset: anlamlı grup',cls:'good',code:'<fieldset>\n  <legend>Seviyen</legend>\n  <label><input type="radio" name="s" value="1"> Yeni</label>\n  <label><input type="radio" name="s" value="2"> Orta</label>\n</fieldset>'},
  b:{lbl:'div: grup adı yok',cls:'bad',code:'<div>\n  <p>Seviyen</p>\n  <label><input type="radio" name="s" value="1"> Yeni</label>\n  <label><input type="radio" name="s" value="2"> Orta</label>\n</div>'}});
add({t:'app',mod:MODC,n:3,h:'🛠️ Uygulama 3: İletişim Sayfası',know:[['select, option, textarea, checkbox, button, fieldset','C bölümü: bu hafta'],['form, label, input, required','B bölümü: bu hafta'],['mailto:, tel:, #id','A bölümü: bu hafta'],['header, nav, main, section, footer','Hafta 7'],['table, th, td','Hafta 6'],['ul, li','Hafta 5']],goal:'Bitmiş iletişim sayfasını incele, aynısını baştan yaz: çalışma saatleri tablosu, e-posta ve telefon bağlantıları ve konu seçimi, mesaj kutusu ile onay kutusu olan bir iletişim formu.',time:'20 dakika'});
add({t:'demo',mod:MODC,h:'Form atölyesi: formu kendin kur',say:'Alanları aç/kapat; kodun ve formun nasıl değiştiğini izle.',build:'lab'});
add({t:'result',mod:MODC,h:'Sayfamız şimdi: kayıt formu hazır',code:()=>FINAL,fs:2.1});
add({t:'list',mod:MODC,cls:'bad',h:'Formlarda sık yapılan hatalar',items:[['📦','Alana <code class="i">name</code> yazmamak: bilgi sunucuya hiç gitmez'],['🏷️','Label yerine sadece placeholder kullanmak: yazmaya başlayınca ne sorulduğu kaybolur'],['🔢','İki alana aynı <code class="i">id</code> vermek: id sayfada tek olmalı. Radio\'da ise <code class="i">name</code> aynı, id farklı olur'],['🔑','Parola kutusunu <code class="i">type="text"</code> yapmak: şifre ekranda okunur. <code class="i">type="password"</code> yaz']]});

/* ---------- slaytları kur ---------- */
const stage=$('#stage');
S.forEach((s,idx)=>{
  const el=document.createElement('section');el.className='slide '+(s.t==='hero'?'hero':s.t==='sec'?'sec':s.t==='app'?'app':'');
  el.dataset.title=(s.h||'').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>');el.dataset.mod=s.mod;
  let h='<span class="mod">'+esc(s.mod)+'</span>';
  if(s.t==='sec')h+='<div class="big">'+s.em+'</div>';
  h+='<h2 class="h">'+s.h+'</h2>';
  if(s.say)h+='<p class="say">'+s.say+'</p>';
  if(s.bn)h+='<p class="bn">'+s.bn+'</p>';
  el.innerHTML=h;
  const body=document.createElement('div');body.className='body';
  if(s.t==='hero'||s.t==='sec'){el.appendChild(body);body.style.display='none'}
  else el.appendChild(body);
  s.el=el;s.body=body;s.built=false;
  stage.appendChild(el);
});
function buildSlide(s){
  if(s.built)return;s.built=true;const b=s.body;
  if(s.t==='cards'){b.innerHTML='<div class="cards" style="--n:'+Math.min(s.n,3)+'">'+s.items.map(i=>'<div class="card"><div class="em">'+i[0]+'</div><b>'+i[1]+'</b><span>'+i[2]+'</span></div>').join('')+'</div>'}
  else if(s.t==='list'){b.innerHTML='<div class="list '+(s.cls||'')+'">'+s.items.map(i=>'<div class="it"><span class="em">'+i[0]+'</span><span>'+i[1]+'</span></div>').join('')+'</div>'}
  else if(s.t==='cr'){
    codeRes(b,s.code,{hl:s.hl,note:s.note,css:s.css,run:s.run,fs:s.page?1.9:3,off:s.off,band:s.band,outline:s.sel,edit:s.edit});
    if(s.try)b.insertAdjacentHTML('beforeend','<div class="try">🧪 <b>Dene:</b> '+s.try+'</div>');
  }
  else if(s.t==='app'){
    b.innerHTML='<div class="appbox"><div class="c"><h3>📚 Şimdiye kadar öğrendiklerimiz</h3><ul>'+s.know.map(k=>'<li><code>'+k[0]+'</code> <small>('+k[1]+')</small></li>').join('')+'</ul></div><div class="c"><h3>🎯 Hedef</h3><p>'+s.goal+'</p><h3>⏱️ Süre önerisi</h3><p>'+s.time+'</p></div></div><a class="appbtn" target="_blank" rel="noopener" href="Hafta-08-Ek-Uygulamalar-Baglanti-ve-Form.html#uygulama-'+s.n+'">Ek uygulamalar dosyasını aç &rarr; '+s.n+'. sekme</a><p class="hintw" style="color:#fff">Bitmiş siteye bak, kendi editöründe baştan yaz. Bitirince sunuya dön ve devam et.</p>'}
  else if(s.t==='cmp'){
    const g=document.createElement('div');g.className='cr';b.appendChild(g);
    [s.a,s.b].forEach(x=>{
      const col=document.createElement('div');col.className='col';
      col.innerHTML='<span class="lbl '+x.cls+'">'+(x.cls==='bad'?'✗ ':x.cls==='good'?'✓ ':'')+x.lbl+'</span>';
      col.appendChild(mkPane(x.code,{name:'Kod'}).el);
      if(s.run!==false)col.appendChild(mkRes(x.code,{css:x.css||'plain',fs:2.8}).el);
      g.appendChild(col);
    });
  }
  else if(s.t==='result'){
    const r=mkRes(s.code(),{fs:s.fs,css:'club'});r.el.style.flex='1';b.appendChild(r.el);
  }
  else if(s.t==='demo'){DEMOS[s.build](b,s)}
}

/* ---------- gezinme ---------- */
let cur=0;
const KEY='web-h8-son-slayt-v1';
function buildMenu(){
  const m=$('#menu');m.innerHTML='';let last='';
  S.forEach((s,i)=>{if(s.mod!==last){last=s.mod;m.insertAdjacentHTML('beforeend','<div class="mh">'+esc(last)+'</div>')}
    const b=document.createElement('button');b.className='mi'+(i===cur?' cur':'');b.innerHTML='<span class="n">'+(i+1)+'</span><span>'+esc(S[i].el.dataset.title)+'</span>';
    b.onclick=()=>{go(i);m.classList.remove('open')};m.appendChild(b)});
}
function go(i){
  i=Math.max(0,Math.min(S.length-1,i));
  clearTimers();
  S.forEach((s,k)=>{s.el.classList.toggle('active',k===i);s.el.classList.toggle('past',k<i)});
  cur=i;buildSlide(S[i]);if(S[i+1])setTimeout(()=>buildSlide(S[i+1]),400);
  $('#counter').textContent=(i+1)+' / '+S.length;
  $('#prog').style.width=((i+1)/S.length*100)+'%';
  $('#prev').disabled=i===0;$('#next').disabled=i===S.length-1;
  document.title='Hafta 8 - '+S[i].el.dataset.title;
  try{localStorage.setItem(KEY,String(i))}catch(e){}
  $$('.mi').forEach((x,k)=>x.classList.toggle('cur',k===i));
}
$('#next').onclick=()=>go(cur+1);$('#prev').onclick=()=>go(cur-1);
$('#bMenu').onclick=()=>$('#menu').classList.toggle('open');
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);
  else if(e.key==='m'||e.key==='M')$('#bMenu').click();
  else if(e.key==='t'||e.key==='T')$('#bTheme').click();
  else if(e.key==='Escape')$('#menu').classList.remove('open');
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(e.target.closest('textarea,input,iframe,pre,.mediabox,.tree,.drawer'))return;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1))},{passive:true});
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('web-tema',t)}catch(e){}}
let th=null;try{th=localStorage.getItem('web-tema')}catch(e){}
if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
setTheme(th);
$('#bTheme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
buildMenu();
let start=0;try{start=parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){}
go(start);
window.__S=S;

</script>

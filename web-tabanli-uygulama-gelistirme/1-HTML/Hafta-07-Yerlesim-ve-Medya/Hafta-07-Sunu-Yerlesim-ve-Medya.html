<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hafta 7 - Yerleşim ve Medya Elemanları</title>
<style>
:root{
  --bg:#f4f5ff;--panel:#ffffff;--panel2:#eceefb;--text:#0e1230;--muted:#434a6d;--line:#c9cfea;
  --accent:#5b36f2;--accent2:#00a3c4;--pink:#e8337f;--ok:#0b8a45;--bad:#d63a3f;--warn:#c76a00;
  --grad:linear-gradient(135deg,#5b36f2 0%,#9a3cf0 55%,#f0407f 100%);
  --code-bg:#ffffff;--c-tag:#c2185b;--c-attr:#1550d0;--c-str:#0a7a3e;--c-com:#6b7390;--c-css:#a35a00;--c-text:#0e1230;
}
:root[data-theme="dark"]{
  --bg:#090c1c;--panel:#141935;--panel2:#1d2348;--text:#ffffff;--muted:#c3c9ea;--line:#38417a;
  --accent:#a592ff;--accent2:#3cd8f5;--pink:#ff7ab0;--ok:#55e08f;--bad:#ff8085;--warn:#ffc04d;
  --grad:linear-gradient(135deg,#7a5cff 0%,#b05cff 55%,#ff6fae 100%);
  --code-bg:#0e1229;--c-tag:#ff86bd;--c-attr:#86bcff;--c-str:#7ef0a8;--c-com:#8c96bb;--c-css:#ffbf66;--c-text:#ffffff;
}
*{box-sizing:border-box}
html{font-size:clamp(16px,min(1.6vw,2.9vh),36px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,textarea{font-family:"JetBrains Mono","Cascadia Code",ui-monospace,Consolas,monospace}

#prog{position:fixed;top:0;left:0;height:.6vh;min-height:5px;background:var(--grad);width:0;z-index:50;transition:width .4s}
#stage{position:fixed;inset:0 0 9vh 0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.3vh;padding:2.4vh 3vw 1vh;opacity:0;visibility:hidden;transform:translateX(5vw);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1),visibility .4s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.past{transform:translateX(-5vw)}
@media(max-aspect-ratio:1/1){.slide{overflow-y:auto}}
.mod{align-self:flex-start;font-size:.55rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:.15em .8em;border-radius:99px}
.h{font-size:1.75rem;font-weight:800;line-height:1.12;letter-spacing:-.01em;margin:0}
.say{font-size:1.05rem;margin:0;font-weight:500}
.bn{font-size:.95rem;margin:0;color:var(--muted)}
.bn b{color:var(--pink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.4vh}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* kapak / bölüm */
.slide.hero,.slide.sec{background:var(--grad);color:#fff;justify-content:center;align-items:flex-start;padding:6vh 6vw;gap:2.5vh}
.slide.hero .h,.slide.sec .h{font-size:2.6rem;color:#fff}
.slide.hero .say,.slide.sec .say{font-size:1.3rem;color:#ffffffe6}
.slide.sec .big{font-size:5rem;line-height:1}
.slide.hero .mod,.slide.sec .mod{background:#ffffff30;color:#fff}

/* kod + sonuç */
.cr{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.cr.one{grid-template-columns:1fr}.cr.one .pane pre{font-size:1.1rem}
@media(max-aspect-ratio:1/1){.cr{grid-template-columns:1fr}.slide{overflow-y:auto}.cr{flex:none}.pane{min-height:35vh}}
.col{display:flex;flex-direction:column;gap:1vh;min-height:0;min-width:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;border:2px solid var(--line);border-radius:1rem;overflow:hidden;background:var(--code-bg);flex:1}
.pane.code{flex:none;max-height:100%}
.col .pane.code{flex:0 1 auto}
.pane-h{display:flex;justify-content:space-between;align-items:center;font-size:.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--panel2);padding:.25em .9em;border-bottom:2px solid var(--line)}
.pane pre{margin:0;padding:.5em .8em;font-size:.82rem;line-height:1.5;color:var(--c-text);overflow:auto;white-space:pre;flex:1;min-height:0}
.pane iframe{border:0;width:100%;flex:1;min-height:0;background:#fff}
.pane textarea{flex:1;min-height:0;border:0;outline:0;resize:none;padding:.5em .8em;font-size:.82rem;line-height:1.5;background:var(--code-bg);color:var(--c-text)}
.cp{border:2px solid var(--line);background:var(--panel);border-radius:.5em;padding:0 .6em;font-size:.5rem;text-transform:none;letter-spacing:0}
.cp.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.t-tag{color:var(--c-tag);font-weight:800}.t-attr{color:var(--c-attr);font-weight:600}.t-str{color:var(--c-str);font-weight:600}.t-com{color:var(--c-com);font-style:italic}.t-pun{color:var(--c-com)}.t-cssp{color:var(--c-css)}
.reg{background:rgba(245,158,11,.22);border-left:.25em solid #f59e0b;margin-left:-.8em;padding-left:.55em}
.hot{background:#ffd43b;color:#14142b!important;border-radius:.2em;box-shadow:0 0 0 .1em #ffd43b;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .22em #ffd43b66}}
.balloon{align-self:flex-start;position:relative;background:#ffd43b;color:#14142b;border-radius:1rem;padding:.3em 1em;font-size:.95rem;font-weight:800;margin-top:.5em}
.balloon::before{content:"";position:absolute;top:-.4em;left:1.4em;border:.45em solid transparent;border-top:0;border-bottom:.45em solid #ffd43b}
.lbl{font-size:.8rem;font-weight:800;padding:.1em .8em;border-radius:99px;align-self:flex-start}
.lbl.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.lbl.neu{background:var(--panel2);color:var(--accent)}
.lbl.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* kontroller */
.ctrls{display:flex;flex-wrap:wrap;gap:1vh 1.6vw;align-items:center;font-size:.8rem}
.ctrls label{display:inline-flex;align-items:center;gap:.4em}
.ctrls input[type=checkbox]{width:1em;height:1em;accent-color:var(--accent)}
.ctrls input[type=range]{accent-color:var(--accent);width:10em}
.ctrls input[type=text],.ctrls select{font-size:.75rem;padding:.1em .5em;border:2px solid var(--line);border-radius:.5em;background:var(--panel);color:var(--text)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:.8em;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:.2em .9em;border-right:2px solid var(--line);font-size:.8rem}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--grad);color:#fff;font-weight:800}
.pane-h .seg button{font-size:.55rem;padding:0 .7em;text-transform:none;letter-spacing:0}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:.8em;padding:.2em .9em;font-size:.8rem}
.btn.pri{background:var(--grad);color:#fff;border:0;font-weight:800}

/* fikir / liste / seçim kartları */
.cards{flex:1;min-height:0;display:grid;gap:2vw;grid-template-columns:repeat(var(--n,3),1fr);align-items:stretch}
.card{background:var(--panel);border:2px solid var(--line);border-radius:1.2rem;padding:1.5vh 1.4vw;display:flex;flex-direction:column;justify-content:center;gap:.6vh;text-align:center}
.card .em{font-size:5rem;line-height:1}
.card b{font-size:1.5rem}
.card span{font-size:1.1rem;color:var(--muted)}
.card code{font-size:1.5rem;color:var(--c-tag);font-weight:800}
.list{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vh}
.list .it{display:flex;align-items:center;gap:1.2vw;font-size:1.15rem;font-weight:600;background:var(--panel);border:2px solid var(--line);border-radius:1.2rem;padding:1.2vh 1.5vw}
.list .it .em{font-size:2rem}
.list.bad .it{border-left:.5rem solid var(--bad)}.list.good .it{border-left:.5rem solid var(--ok)}
code.i{background:var(--panel2);padding:0 .3em;border-radius:.3em;border:1px solid var(--line);color:var(--c-tag);font-weight:700}

/* sayfa haritası */
.pmap{flex:1;min-height:0;display:grid;gap:.6vh;grid-template-columns:1fr 14vw;grid-template-rows:auto auto 1fr auto;grid-template-areas:"hd hd" "nv nv" "mn sd" "ft ft";padding:.8vh;background:var(--panel2);border-radius:1rem;border:2px solid var(--line)}
.pmap .z{border:3px dashed var(--line);border-radius:.8rem;padding:.3em .8em;font-weight:800;font-size:.9rem;opacity:.15;transform:scale(.96);transition:all .5s;display:flex;align-items:center}
.pmap .z.show{opacity:1;transform:none;border-style:solid}
.z-hd{grid-area:hd;background:#ffe3d6;color:#7c2d12}.z-nv{grid-area:nv;background:#dbe9ff;color:#1e3a8a}.z-mn{grid-area:mn;background:#d9f5de;color:#14532d;flex-wrap:wrap;gap:.5em}.z-sd{grid-area:sd;background:#fff1bd;color:#713f12}.z-ft{grid-area:ft;background:#e7d8ff;color:#4c1d95}
.pmap.soup .z{background:var(--panel);color:var(--text);border-color:var(--muted)}
.pmap .z.hl{outline:4px solid var(--accent)}
.mn-in{display:flex;gap:.5em;width:100%}
.mn-in span{flex:1;border:3px dashed #2f855a;border-radius:.6rem;padding:0 .5em;font-size:.8rem;background:#ffffffaa;color:#14532d;opacity:.15;transition:opacity .5s}
.pmap.soup .mn-in span{background:var(--panel);color:var(--text);border-color:var(--muted)}

.tree{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:1vh 1vw;overflow:auto;min-height:0}
.tree div{padding:.05em .5em;border-radius:.4em;white-space:nowrap}
.tree .f{cursor:pointer}.tree .f:hover{background:var(--panel2)}
.tree .from{background:#ffd2bd;color:#7c2d12;font-weight:800}.tree .to{background:#bfeccf;color:#14532d;font-weight:800}
.pathout{font-size:.9rem;padding:.5em .8em;background:var(--code-bg);border:2px solid var(--line);border-radius:1rem;overflow:auto}
.bars{display:grid;gap:.8vh;font-size:.7rem}
.bars .row{display:flex;align-items:center;gap:.6em}
.bars .lab{width:11em;flex:none}
.bars .bg{flex:1;height:.9em;background:var(--panel2);border-radius:.5em;overflow:hidden;border:1px solid var(--line)}
.bars .fill{display:block;height:100%;background:var(--muted)}
.bars .row.pick .fill{background:var(--ok)}.bars .row.pick .lab{font-weight:800;color:var(--ok)}
.vp{border:3px solid var(--muted);border-radius:1rem;background:var(--panel2);padding:.4em;text-align:center;font-weight:800;font-size:.75rem;transition:width .15s;max-width:100%}
.mediabox{flex:1;display:grid;place-items:center;background:var(--panel2);text-align:center;padding:.5em;min-height:0}
.mediabox video,.mediabox audio{max-width:100%;max-height:100%;border-radius:.6em}
.hintw{font-size:.6rem;color:var(--warn);font-weight:700}

/* uygulama ara slaytları */
.slide.app{background:linear-gradient(135deg,#0f766e 0%,#0891b2 55%,#2563eb 100%);color:#fff;border-top:.6vh dashed #fde047}
.slide.app .h{color:#fff}.slide.app .mod{background:#ffffff30;color:#fff}
.slide.app .body{flex:1;justify-content:center}
.appbox{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
@media(max-aspect-ratio:1/1){.appbox{grid-template-columns:1fr}}
.appbox .c{background:#ffffff1f;border:2px solid #ffffff66;border-radius:1rem;padding:1.2vh 1.2vw;font-size:.95rem}
.appbox h3{margin:0 0 .3em;font-size:1rem;color:#fde047}.appbox p{margin:0 0 .6em}.appbox ul{margin:0;padding-left:1.2em}.appbox code{color:#fff;font-weight:800}
.appbtn{align-self:flex-start;background:#fde047;color:#14142b;font-weight:800;font-size:1.05rem;padding:.4em 1.4em;border-radius:1rem;text-decoration:none}
/* alt çubuk */
#bottom{position:fixed;inset:auto 0 0 0;height:9vh;display:flex;align-items:center;justify-content:space-between;gap:1vw;padding:0 2vw;background:var(--panel);border-top:2px solid var(--line);z-index:40}
.nbtn{background:var(--grad);color:#fff;border:0;border-radius:1rem;padding:.25em 1.6em;font-weight:800;font-size:1rem;min-width:7em;height:75%}
.nbtn:disabled{opacity:.3}
.sbtn{border:2px solid var(--line);background:var(--panel2);border-radius:1rem;padding:.25em .8em;font-size:.85rem;height:75%}
#counter{font-size:.9rem;font-weight:700;color:var(--muted);min-width:5em;text-align:center}
.mid{display:flex;align-items:center;gap:1vw;flex:1;justify-content:center}
.drawer{position:fixed;top:0;bottom:9vh;left:0;width:min(30rem,92vw);background:var(--panel);border-right:2px solid var(--line);z-index:60;overflow:auto;padding:1vh 1vw;transform:translateX(-105%);transition:transform .3s}
.drawer.open{transform:none}
.mi{display:flex;gap:.6em;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.25em .3em;font-size:.65rem}
.mi:hover{background:var(--panel2)}.mi.cur{background:var(--panel2);font-weight:800;color:var(--accent)}
.mi .n{width:2em;color:var(--muted)}
.mh{font-size:.55rem;font-weight:800;text-transform:uppercase;color:var(--muted);margin:.8em 0 .1em}
@media(prefers-reduced-motion:reduce){.slide{transition:none}.hot{animation:none}}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"></div>
<div id="menu" class="drawer"></div>
<div id="bottom">
  <button class="sbtn" id="bMenu" title="Slayt listesi (M)">&#9776;</button>
  <div class="mid">
    <button class="nbtn" id="prev">&larr; Geri</button>
    <div id="counter"></div>
    <button class="nbtn" id="next">İleri &rarr;</button>
  </div>
  <button class="sbtn" id="bTheme" title="Tema (T)">&#9680;</button>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escA(s){return esc(s).replace(/"/g,'&quot;')}

/* ---------- kod renklendirme ---------- */
function hlCSS(css){
  return esc(css).replace(/([^{}]+)\{([^{}]*)\}/g,(m,sel,body)=>'<span class="t-tag">'+sel+'</span>{'+body.replace(/([a-z-]+)(\s*:\s*)([^;]+)(;?)/g,(x,p,c,v,s)=>'<span class="t-cssp tk" data-k="c:'+p+'">'+p+'</span>'+c+'<span class="t-str">'+v+'</span>'+s)+'}');
}
function hl2(code){
  const parts=[];let i=0;
  const re=/(<!--[\s\S]*?-->)|<(\/?)([a-zA-Z][\w-]*)((?:[^>"']|"[^"]*"|'[^']*')*)>/g;let m;
  while((m=re.exec(code))){
    parts.push(esc(code.slice(i,m.index)));
    if(m[1]){parts.push('<span class="t-com">'+esc(m[1])+'</span>');i=re.lastIndex;continue}
    let a=m[4],self='';
    if(/\/\s*$/.test(a)){self='/';a=a.replace(/\/\s*$/,'')}
    const nm=m[3].toLowerCase();
    const at=a.replace(/([^\s=]+)(?:(=)("[^"]*"|'[^']*'|[^\s]+))?/g,(x,n,e,v)=>'<span class="t-attr tk" data-k="a:'+escA(n)+'">'+esc(n)+'</span>'+(v?'<span class="t-pun">'+esc(e)+'</span><span class="t-str tk" data-k="a:'+escA(n)+'">'+esc(v)+'</span>':''));
    parts.push('<span class="t-pun">&lt;'+esc(m[2])+'</span><span class="t-tag tk" data-k="t:'+nm+'">'+m[3]+'</span>'+at+'<span class="t-pun">'+self+'&gt;</span>');
    i=re.lastIndex;
    if(nm==='style'&&!m[2]){const e=code.indexOf('</style>',i);if(e>-1){parts.push(hlCSS(code.slice(i,e)));i=e;re.lastIndex=e}}
  }
  parts.push(esc(code.slice(i)));
  return parts.join('');
}
function copyText(t,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='Kopyalandı';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok')},1200)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}
}

/* ---------- internetsiz örnek görseller ---------- */
function svgImg(w,h,label,color){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="#1b1b3a"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="${w*0.78}" cy="${h*0.28}" r="${Math.min(w,h)*0.12}" fill="#ffd166"/><rect x="${w*0.18}" y="${h*0.38}" width="${w*0.22}" height="${h*0.32}" rx="${h*0.04}" fill="rgba(255,255,255,.9)"/><circle cx="${w*0.24}" cy="${h*0.5}" r="${h*0.04}" fill="#6d4aff"/><circle cx="${w*0.34}" cy="${h*0.5}" r="${h*0.04}" fill="#6d4aff"/><path d="M0 ${h} L${w*0.3} ${h*0.62} L${w*0.5} ${h*0.8} L${w*0.7} ${h*0.55} L${w} ${h} Z" fill="rgba(255,255,255,.2)"/><text x="50%" y="${h*0.93}" text-anchor="middle" font-family="Arial" font-size="${Math.max(12,h*0.09)}" fill="#fff">${label}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const FAKE={'resimler/kulup.jpg':[480,270,'Robot atölyesi','#6d4aff'],'resimler/galeri1.jpg':[480,160,'Etkinlik 1','#ef4444'],'resimler/galeri2.jpg':[480,160,'Etkinlik 2','#10b981'],'resimler/galeri3.jpg':[480,160,'Etkinlik 3','#3b82f6'],'video/kapak.jpg':[480,270,'Video kapağı','#e07a00']};
const FAKEPLAYER='<body style="margin:0;height:100vh;display:grid;place-items:center;background:#1b1b3a;color:#fff;font:700 14px Arial"><div style="text-align:center"><div style="width:54px;height:54px;margin:0 auto 6px;border-radius:50%;background:#ef4444;display:grid;place-items:center">&#9654;</div>Video sitesinden gömülen oynatıcı</div></body>';
function resolveForRun(code){
  code=code.replace(/(<iframe[^>]*?)src="https?:\/\/[^"]*"/,(m,a)=>a+'src="data:text/html;charset=utf-8,'+encodeURIComponent(FAKEPLAYER)+'"');
  const f=(m,a,n)=>FAKE[n]?a+'="'+svgImg(...FAKE[n])+'"':m;
  code=code.replace(/<source[^>]*\.(mp4|mp3)"[^>]*>/g,'');
  return code.replace(/(src|poster)="([^"]+)"/g,(m,a,n)=>f(m,a,n));
}
/* sonuç penceresinin stili: yazı boyutu pencerenin genişliğine göre ölçeklenir */
let o_cols=false;
function pageCss(mode,fs,cols2){o_cols=!!cols2;
  const base=`body{font:${fs}vw/1.4 system-ui,"Segoe UI",Arial,sans-serif;margin:0;color:#14183a;background:#fff}img,video{max-width:100%;border-radius:.4em}`;
  const cols=o_cols?'body{columns:2;column-gap:1.2em}section,article,figure,details{break-inside:avoid}':'';
  if(mode==='plain')return '<style>'+base+'body{margin:.5em}h2{margin:.15em 0;font-size:1.3em}p{margin:.15em 0}</style>';
  return '<style>'+base+(cols2?'':'')+`body{background:#f3f4fb}header,.ust{background:linear-gradient(135deg,#6d4aff,#a14bff);color:#fff;padding:.4em .8em}header h1,.ust .baslik{margin:0;font-size:1.4em;font-weight:800}header p{margin:0}nav,.menu{background:#fff;padding:.3em .8em;border-bottom:1px solid #e2e6f3}nav a,.menu a{color:#6d4aff;margin-right:.7em;text-decoration:none;font-weight:700}main,.icerik{display:block;padding:.2em .6em}section,.bolum,article,.yazi,details,.kart{background:#fff;border-radius:.5em;padding:.3em .7em;margin:.3em 0;box-shadow:0 1px 5px #0002}.baslik{font-weight:800}h2,h3{margin:.1em 0;font-size:1.15em}p{margin:.1em 0}aside,.yan{background:#fff4c9;margin:.3em .6em;padding:.3em .7em;border-radius:.5em}footer,.alt{background:#232846;color:#cfd4ef;padding:.4em .8em;font-size:.85em}iframe{width:100%;height:8em;border:0;border-radius:.4em}figure{margin:.2em 0}figcaption{font-size:.8em;color:#667}.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.4em}.slider img{flex:none;width:100%;height:4.5em;object-fit:cover;scroll-snap-align:center}.rozet{background:#ece8ff;color:#5b36f2;padding:.1em .6em;margin:.15em;border-radius:99px;font-weight:700}.vurgu{color:#d6336c;font-weight:800;background:#ffe0ef;border-radius:.2em;padding:0 .15em}summary{font-weight:700;cursor:pointer}${cols}</style>`;
}
function runDoc(code,o){
  const ol=o.outline?'<style>'+o.outline+'{outline:.2em dashed #f59e0b!important;outline-offset:-.1em;box-shadow:0 0 0 .3em #f59e0b66!important}</style>':'';
  const sc=o.outline?'<script>var e=document.querySelector("'+o.outline+'");if(e)e.scrollIntoView({block:"center"})<\/script>':'';
  return '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">'+pageCss(o.css||'club',o.fs||3,o.cols)+ol+'</head><body>'+resolveForRun(code)+sc+'</body></html>'}
/* "Özellik yok / var" önce-sonra düğmesi */
function offSeg(host,before,apply){
  const c=ctl('<div class="seg"><button data-v="0">Özellik yok</button><button data-v="1" class="on">Özellik var</button></div>');
  host.insertBefore(c,before||null);
  $$('button',c).forEach(x=>x.onclick=()=>{$$('button',c).forEach(y=>y.classList.remove('on'));x.classList.add('on');apply(x.dataset.v==='1')});
}

/* ---------- kod/sonuç parçaları ---------- */
function mkPane(code,o){
  o=o||{};
  const p=document.createElement('div');p.className='pane code';
  p.innerHTML='<div class="pane-h"><span>'+esc(o.name||'Kod')+'</span><button class="cp">Kopyala</button></div>';
  const pre=document.createElement('pre');p.appendChild(pre);
  const ta=document.createElement('textarea');ta.spellcheck=false;ta.style.display='none';p.appendChild(ta);
  let cur=code,edit=false,onChange=null;
  /* o.region: etiket adı; bu etiketin başlangıç-bitiş satırları tüm kod içinde işaretlenir */
  const regionRange=t=>{const L=cur.split('\n');let a=-1,ind='';
    for(let i=0;i<L.length;i++){const m=L[i].match(new RegExp('^(\\s*)<'+t+'[\\s>]'));if(m){a=i;ind=m[1];break}}
    if(a<0)return null;
    for(let j=a;j<L.length;j++)if(L[j].indexOf(ind+'</'+t+'>')===0||(j===a&&L[j].indexOf('</'+t+'>')>0))return [a,j];
    return [a,a]};
  const render=()=>{let h=hl2(cur);
    const rg=o.region&&regionRange(o.region);
    if(rg){h=h.split('\n').map((l,i)=>i>=rg[0]&&i<=rg[1]?'<span class="reg" style="display:block">'+(l||' ')+'</span>':l+(i<h.split('\n').length-1?'\n':'')).join('')}
    pre.innerHTML=h;(o.hl||[]).forEach(k=>$$('.tk[data-k="'+k+'"]',pre).forEach(x=>x.classList.add('hot')));
    const r=$('.reg',pre);if(r)pre.scrollTop=Math.max(0,r.offsetTop-pre.clientHeight/3)};
  render();
  $('.cp',p).onclick=e=>copyText(cur,e.target);
  if(o.edit){
    const b=document.createElement('button');b.className='cp';b.textContent='✎ Düzenle';$('.pane-h',p).insertBefore(b,$('.cp',p));
    b.onclick=()=>{edit=!edit;if(edit){ta.value=cur;ta.style.display='block';pre.style.display='none';b.textContent='✓ Bitti'}else{cur=ta.value;ta.style.display='none';pre.style.display='block';b.textContent='✎ Düzenle';render();onChange&&onChange(cur)}};
    ta.addEventListener('input',()=>{cur=ta.value;onChange&&onChange(cur)});
  }
  return {el:p,set(c,h){cur=c;if(h)o.hl=h;render()},get:()=>cur,onChange(f){onChange=f}};
}
function mkRes(code,o){
  o=o||{};
  const p=document.createElement('div');p.className='pane';
  p.innerHTML='<div class="pane-h"><span>Sonuç'+(o.outline?' <small>(turuncu çerçeve = bu parça)</small>':'')+'</span></div>';
  const fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts');fr.title='Sonuç';p.appendChild(fr);
  const upd=c=>{fr.srcdoc=runDoc(c,o)};upd(code);
  return {el:p,set:upd};
}
/* kod + sonuç + (isteğe bağlı) balon */
function codeRes(host,code,o){
  o=o||{};
  const cr=document.createElement('div');cr.className='cr'+(o.run===false?' one':'');
  const left=document.createElement('div');left.className='col';
  const cp=mkPane(code,o);left.appendChild(cp.el);
  if(o.note){const b=document.createElement('div');b.className='balloon';b.innerHTML=o.note;left.appendChild(b)}
  cr.appendChild(left);
  let rs=null;
  if(o.run!==false){rs=mkRes(code,o);cr.appendChild(rs.el)}
  host.appendChild(cr);
  if(o.edit&&rs)cp.onChange(c=>rs.set(c));
  if(o.off&&rs)offSeg(host,cr,on=>{const c=on?code:code.replace(new RegExp(o.off),'');cp.set(c,on?o.hl:[]);rs.set(c)});
  return {set(c,h){cp.set(c,h);if(rs)rs.set(c)},cp,rs};
}

  say:'Kendine sor: <b>"Bunu kesip başka sayfaya koysam tek başına anlaşılır mı?"</b> Evet → <b>article</b> (haber, duyuru, yorum). Hayır, sayfanın bir bölümü → <b>section</b>. Emin olamazsan section yaz.'});
tg('aside','Ana içeriğin <b>yanındaki</b> küçük bilgi: ipucu, reklam, ilgili bağlantılar. Silsen de asıl içerik anlaşılır. Olmazsa yan not asıl içerikle karışır. <b>Fark:</b> aside sayfanın ortasında ya da yanında durur; sayfanın sonunda duran bilgi footer\'dır.','📝 <b>Benzetme:</b> kitabın kenarındaki not: okumasan da hikâye anlaşılır.','<aside>\n  <p>Atölyeye laptopunuzu getirin.</p>\n</aside>','aside = yan bilgi / hatırlatma');
tg('footer','Sayfanın <b>alt kısmı</b>: telif, iletişim, adres, sosyal medya. Her sayfada aynı yerde bulunur, ziyaretçi "en alta bakayım" der. Olmazsa bu bilgiler sayfaya dağılır. <b>Fark:</b> footer sayfanın <b>sonudur</b>; aside ise içeriğin yanındaki nottur.','✉️ <b>Benzetme:</b> mektubun altındaki imza ve adres.','<footer>\n  <p>&copy; 2026 Robotik Kulübü</p>\n</footer>','footer = sayfanın alt bilgisi');
add({t:'cmp',mod:MODB,h:'aside ile footer farkı',
  a:{lbl:'aside = yan not',cls:'neu',code:'<aside>\n  <p>Atölyeye laptopunuzu getirin.</p>\n</aside>'},
  b:{lbl:'footer = sayfa sonu bilgisi',cls:'neu',code:'<footer>\n  <p>&copy; 2026 Robotik Kulübü</p>\n</footer>'},
  say:'<b>aside</b> içerikle ilgili <b>ek bilgidir</b> (ipucu, hatırlatma); yerine göre ortada ya da yanda durur. <b>footer</b> sayfanın <b>en altında</b> telif ve iletişim taşır. Soru: "Bu, konuyla ilgili ek not mu?" → aside. "Sayfa bitti, künye mi?" → footer.'});
add({t:'app',mod:MODB,n:1,h:'🛠️ Uygulama 1: Okul Kantini Menüsü',know:[['div, span','A bölümü: div ve span'],['header, main, footer','B bölümü: anlamlı etiketler'],['Başlık, liste, tablo','Önceki haftalar']],goal:'Bitmiş kantin menüsü sayfasını inceleyip aynısını baştan yaz. Kartları <b>div</b> ile grupla, fiyatı <b>span</b> ile vurgula, sayfayı <b>header</b>, <b>main</b> ve <b>footer</b> ile kur.',time:'10-15 dakika'});
add({t:'cmp',mod:MODB,h:'Aynı sayfa: hangisi daha anlaşılır?',say:'Gözle ikisi <b>aynı görünüyor</b>. Fark: ekran okuyucu ve Google yalnızca sağdakini anlar.',
  a:{lbl:'div çorbası',cls:'bad',code:'<div class="ust">Robotik Kulübü</div>\n<div class="menu">Ana Sayfa</div>\n<div class="icerik">Asıl içerik</div>\n<div class="yan">Yan not</div>\n<div class="alt">Alt kısım</div>'},
  b:{lbl:'anlamlı etiketler',cls:'good',code:'<header>Robotik Kulübü</header>\n<nav>Ana Sayfa</nav>\n<main>Asıl içerik</main>\n<aside>Yan not</aside>\n<footer>Alt kısım</footer>'}});
add({t:'cr',mod:MODB,h:'&lt;figure&gt; ve &lt;figcaption&gt;',
  code:'<figure>\n  <img src="resimler/kulup.jpg"\n       alt="Robot atölyesi">\n  <figcaption>Cuma atölyesi</figcaption>\n</figure>',hl:['t:figure','t:figcaption'],note:'figure = resim + altyazı bir arada',ctx:'figure',ctxFull:true,
  say:'<b>figure</b> resmi (ya da tablo, kod gibi bir görseli) ve <b>altyazısını</b> tek pakette tutar; altyazıyı <b>figcaption</b> yazar. Olmazsa altyazı sıradan bir paragraf olur, resimle bağı kaybolur. Resim taşınırsa altyazı da birlikte gider.',bn:'🖼️ <b>Benzetme:</b> müzedeki tablo ve altındaki etiket: ikisi birlikte asılır.'});
add({t:'cmp',mod:MODB,h:'figure ile img farkı',
  a:{lbl:'sadece img + p',cls:'neu',code:'<img src="resimler/kulup.jpg"\n     alt="Robot atölyesi">\n<p>Cuma atölyesi</p>'},

  say:'<b>img</b> sadece resmin kendisidir. <b>figure</b> resmi ve altyazısını <b>birbirine bağlayan kutudur</b>; içinde img durur. Altyazı yoksa figure şart değil, img yeter. <b>Ne zaman?</b> Resmin "Şekil 1" gibi bir açıklaması varsa figure.'});
add({t:'cr',mod:MODB,h:'&lt;details&gt; ve &lt;summary&gt;',

  say:'<b>details</b> tıklayınca <b>açılıp kapanan</b> bölümdür. <b>summary</b> her zaman görünen başlıktır; geri kalan içerik tıklayınca açılır. Sık sorulan sorular için ideal. JavaScript yazmadan, tarayıcı kendisi yapar. Olmazsa cevapların hepsi sayfada açık durur, sayfa uzar.',bn:'🗄️ <b>Benzetme:</b> çekmece: dışarıda etiketi görürsün, çekince içi açılır.'});
add({t:'cmp',mod:MODB,h:'details ile normal paragraf farkı',
  a:{lbl:'normal p = hep açık',cls:'neu',code:'<p>Nasıl katılırım?</p>\n<p>Cuma günü laboratuvara gel.</p>'},
  b:{lbl:'details = tıklayınca açılır',cls:'neu',code:'<details>\n  <summary>Nasıl katılırım?</summary>\n  <p>Cuma günü laboratuvara gel.</p>\n</details>'},
  say:'Normal paragrafta <b>her şey açık durur</b>; sayfa uzar. details içeriği <b>gizler</b>, ziyaretçi isterse açar. Soruyu sol örnekte görmek için kaydırman gerekir. <b>Ne zaman?</b> Cevap uzunsa ve herkes okumak zorunda değilse details; önemli bilgiyi gizleme, paragraf yaz.'});

add({t:'cards',mod:MODC,h:'Dosya yolu: dosya nerede?',n:2,items:[['🗺️','Adres tarifi','HTML dosyası, resmin nerede olduğunu <b>yazıyla</b> söyler'],['⬆️','<code>../</code>','"Bir klasör yukarı çık" demektir']],say:'Yol yanlışsa resim görünmez.'});

add({t:'cr',mod:MODC,h:'&lt;img&gt;: resim koy',
  code:'<img src="resimler/kulup.jpg">',hl:['t:img'],note:'img = sayfaya resim koyar (kapanış etiketi yok)',
  say:'<b>img</b> sayfaya bir <b>resim</b> koyar. İçine yazı girmez, o yüzden <b>kapanış etiketi yoktur</b>. Hangi resim olduğunu özellikler (src, alt...) söyler. Etiketi yazmazsan sayfada resim olmaz; sadece yazı kalır.',bn:'🖼️ <b>Benzetme:</b> duvara fotoğraf asmak. Çerçeve etiket, hangi fotoğraf olduğu özellik.'});
add({t:'cr',mod:MODC,h:'src = resmin adresi',
  code:'<img src="resimler/kulup.jpg">',hl:['a:src'],note:'src = resmin adresi (hangi dosya?)',
  say:'<b>src</b> ("sorsa" okunur, kaynak) tarayıcıya <b>hangi dosyayı</b> göstereceğini söyler. Olmazsa tarayıcı hangi resmi koyacağını bilemez; boş kalır. Yol yanlışsa da resim görünmez.',bn:'📮 <b>Benzetme:</b> paketin üstündeki adres: yanlışsa paket ulaşmaz.'});
add({t:'cr',mod:MODC,h:'alt = resmin yazılı tarifi',
  code:'<img src="resimler/kulup.jpg"\n     alt="Robot atölyesi">',hl:['a:alt'],note:'alt = resmin yazılı tarifi',
  say:'<b>alt</b> ("alternatif metin") resmi <b>yazıyla anlatır</b>. Üç işe yarar: resim yüklenemezse yerine çıkar; görme engelli kullanıcıların ekran okuyucusu bunu okur; Google resmi bununla tanır. Olmazsa bu kişiler resimden hiçbir şey anlamaz.',bn:'📞 <b>Benzetme:</b> telefonda bir fotoğrafı arkadaşına tarif etmek.'});
add({t:'demo',mod:MODC,h:'alt neden önemli?',say:'Dosya bulunamazsa ne olur?',build:'alt'});
add({t:'cr',mod:MODC,h:'width ve height = boyut',
  code:'<img src="resimler/kulup.jpg"\n     alt="Robot atölyesi"\n     width="240" height="135">',hl:['a:width','a:height'],off:'\\n\\s*width="240" height="135"',note:'width, height = genişlik ve yükseklik (piksel)',
  say:'<b>width</b> genişlik, <b>height</b> yüksekliktir (piksel). Sayfa yüklenirken tarayıcı resim inmeden <b>yerini ayırır</b>. Olmazsa resim gelince yazılar aşağı <b>kayar</b>, okuyan kişi satırını kaybeder. "Özellik yok / var" düğmesiyle dene.',bn:'🪑 <b>Benzetme:</b> sinemada koltuğu önceden ayırtmak: gelen yerini bulur, kimse itişmez.'});
add({t:'demo',mod:MODC,h:'Boyutu değiştir',say:'Kaydırıcıları oynat, kodu ve resmi izle.',build:'img'});
add({t:'cr',mod:MODC,h:'loading="lazy" = tembel yükleme',
  code:'<img src="resimler/kulup.jpg"\n     alt="Robot atölyesi"\n     loading="lazy">',hl:['a:loading'],note:'lazy = tembel: bu resim, sen aşağı kaydırıp ona yaklaşana kadar indirilmez',
  say:'Sayfada 20 resim olsun. Normalde tarayıcı <b>hepsini sayfa açılırken indirir</b>, sayfa geç açılır. <b>lazy</b> yazarsan yalnızca ekranda görünen resimler hemen iner; aşağıdakiler <b>sen kaydırdıkça</b> iner.',bn:'🍕 <b>Benzetme:</b> 20 pizza kutusunu masaya birden açmak yerine, sıra gelince birer birer açmak.'});
add({t:'cr',mod:MODC,h:'srcset = aynı resmin boyları',
  code:'<img src="resimler/kulup-720.jpg"\n     srcset="resimler/kulup-360.jpg 360w,\n             resimler/kulup-720.jpg 720w"\n     alt="Robot atölyesi">',run:false,hl:['a:srcset'],note:'srcset = aynı resmin küçük ve büyük hâlleri; tarayıcı seçer',
  say:'<b>srcset</b> aynı resmin <b>birden çok boyunu</b> listeler (360w = 360 piksel genişlikte). Tarayıcı ekrana uygun olanı seçer. Telefon küçüğü indirir, veri harcamaz. Olmazsa telefon da büyük resmi indirir, sayfa yavaşlar. <b>Aynı resim</b>, sadece boyu farklı.',bn:'🍕 <b>Benzetme:</b> küçük, orta, büyük pizza: kaç kişiysen onu getirirler.'});
add({t:'demo',mod:MODC,h:'Tarayıcı hangisini seçer?',say:'Ekran genişliğini değiştir.',build:'srcset'});
add({t:'cr',mod:MODC,h:'&lt;picture&gt; = biçim seç',
  code:'<picture>\n  <source srcset="kulup.avif"\n          type="image/avif">\n  <source srcset="kulup.webp"\n          type="image/webp">\n  <img src="resimler/kulup.jpg"\n       alt="Robot atölyesi">\n</picture>',run:false,hl:['t:picture'],note:'picture = tarayıcı bildiği ilk biçimi seçer',
  say:'<b>picture</b> aynı resmin <b>farklı dosya biçimlerini</b> (AVIF, WebP, JPG) sıralar. Tarayıcı bildiği <b>ilk</b> biçimi indirir. Yeni biçimler küçüktür ama eski tarayıcı bilmez; en alttaki <b>img yedektir</b> ve zorunludur. Olmazsa eski tarayıcılarda resim görünmez.',bn:'🗣️ <b>Benzetme:</b> bir kitabı Türkçe, İngilizce, Almanca bastırmak; okur bildiği dili alır.'});
add({t:'demo',mod:MODC,h:'picture: hangi dosya inecek?',say:'Tarayıcıyı değiştir; sarı satır, seçilen dosyayı gösterir.',build:'picture'});
add({t:'cards',mod:MODC,h:'img, srcset, picture: farkları',n:3,items:[['🖼️','<code>img</code>','Tek resim, tek dosya. Her yerde çalışır. Basit sayfalar için yeter.'],['📏','<code>srcset</code>','Aynı resim, <b>farklı boyutlar</b>. Tarayıcı ekrana göre seçer. img içindeki özelliktir.'],['🎞️','<code>picture</code>','Aynı resim, <b>farklı biçimler</b> (AVIF/WebP/JPG). Tarayıcı bildiğini seçer. Ayrı bir etikettir.']],say:'<b>Boyut</b> farkı için srcset, <b>biçim</b> farkı için picture. İkisi birlikte de olabilir. Üçünde de <code class="i">alt</code> yazmayı unutma.'});
add({t:'app',mod:MODC,n:2,h:'🛠️ Uygulama 2: Kişisel Tanıtım Kartı',know:[['header, section, article, aside','B bölümü'],['figure, figcaption','B bölümü: figure ile img farkı'],['img, src, alt, width/height','C bölümü: img slaytları'],['a (bağlantı)','Hafta 5']],goal:'Kendini tanıtan bir kart sayfası yap: semantik iskelet kur, <b>figure</b> içine fotoğrafını ve altyazısını koy, bir <b>a</b> bağlantısı ekle.',time:'15 dakika'});
add({t:'cr',mod:MODC,h:'&lt;video&gt;: video koy',
  code:'<video src="video/tanitim.mp4">\n</video>',media:'video',hl:['t:video'],note:'video = sayfaya video oynatıcı ekler',

add({t:'cr',mod:MODC,h:'controls = kumanda',

  say:'<b>controls</b> ("kıntrols", kumanda) oynat, durdur, ses ve tam ekran <b>düğmelerini</b> ekler. Değer yazılmaz; yazılması yeter. Olmazsa kullanıcı videoyu <b>başlatamaz</b>. Düğmeyle önce-sonra farkına bak.',bn:'🎮 <b>Benzetme:</b> televizyonun kumandası: kumanda yoksa açamazsın.',media:'video'});
add({t:'cr',mod:MODC,h:'poster = video kapağı',

  say:'<b>poster</b> ("postır", afiş) video başlamadan önce görünen <b>kapak resmidir</b>. Olmazsa videonun ilk karesi (çoğu zaman siyah ya da boş) görünür; ziyaretçi neye tıkladığını anlamaz. Adresi src gibi bir resim dosyasıdır.',bn:'🎬 <b>Benzetme:</b> sinema afişi: filmi izlemeden önce neyle ilgili olduğunu gösterir.',media:'video'});
add({t:'cr',mod:MODC,h:'loop, muted, autoplay',
  code:'<video controls loop muted\n       src="video/tanitim.mp4">\n</video>',run:false,hl:['a:loop','a:muted'],note:'loop = tekrar et · muted = sessiz · autoplay = kendiliğinden başla',
  say:'Üç ayrı anahtar: <b>loop</b> (lup) bitince baştan başlatır; <b>muted</b> (myutıd) sesi kapatır; <b>autoplay</b> (otoplay) sayfa açılınca kendiliğinden başlatır. Tarayıcılar <b>sesli</b> kendiliğinden başlamayı engeller; autoplay ancak <b>muted</b> ile çalışır. Olmazsa autoplay sessizce hiçbir şey yapmaz.',bn:'🔁 <b>Benzetme:</b> mağaza vitrinindeki sessiz ve sürekli dönen tanıtım ekranı.'});
add({t:'demo',mod:MODC,h:'Video özelliklerini dene',say:'Kutuları işaretle; kodu ve videoyu izle.',build:'video'});
add({t:'cr',mod:MODC,h:'&lt;audio&gt;: ses koy',
  code:'<audio controls>\n  <source src="ses/kulup-marsi.mp3"\n          type="audio/mpeg">\n</audio>',run:false,hl:['t:audio'],note:'audio = ses oynatıcı (video ile aynı özellikler)',
  say:'<b>audio</b> sayfaya <b>ses</b> koyar: müzik, podcast, konuşma. Görüntüsü yoktur, sadece oynatma çubuğu çıkar. <b>controls</b>, <b>loop</b>, <b>muted</b> gibi özellikleri video ile aynıdır. Olmazsa ses sayfaya girmez. <b>source</b> yedek dosya sunar: tarayıcı bildiği biçimi seçer.',bn:'🎧 <b>Benzetme:</b> cep müzik çalar: sadece ses, ekran yok.'});
add({t:'cards',mod:MODC,h:'video ile audio farkı',n:2,items:[['🎬','<code>video</code>','Görüntü + ses. Ekranda <b>bir kutu</b> yer kaplar. Kapak resmi (<code>poster</code>) vardır, boyut (<code>width</code>) verilir.'],['🎵','<code>audio</code>','Sadece ses. Ekranda <b>ince bir çubuk</b> olur. Poster ve görüntü yoktur. Dosyası genelde çok küçüktür.']],say:'İkisi aynı mantıkla çalışır (controls, loop, muted, source). Fark: görüntü var mı? <b>Konuşma, müzik</b> için audio; <b>görüntülü anlatım</b> için video. Sadece sesli içeriği video yapmak dosyayı gereksiz büyütür.'});

    cp.set('<audio '+a.join(' ')+'>\n  <source src="ses/kulup-marsi.mp3"\n          type="audio/mpeg">\n</audio>',a.map(x=>'a:'+x));
    const box=$('#ab');box.innerHTML='';const el=document.createElement('audio');el.src=makeAudio();el.controls=on.controls;el.loop=on.loop;el.muted=on.muted;box.appendChild(el);
    if(!on.controls){const bt=document.createElement('button');bt.className='btn';bt.textContent='▶ Çal/Durdur';bt.onclick=()=>el.paused?el.play():el.pause();box.appendChild(bt)}
  };
  $$('input',c).forEach(i=>i.onchange=draw);draw();
 },
 slider(b){
  codeRes(b,'<style>\n  .slider{display:flex;overflow-x:auto;\n          scroll-snap-type:x mandatory}\n  .slider img{flex:none;width:100%;\n          height:150px;object-fit:cover;\n          scroll-snap-align:center}\n</style>\n<div class="slider">\n  <img src="resimler/galeri1.jpg">\n  <img src="resimler/galeri2.jpg">\n  <img src="resimler/galeri3.jpg">\n</div>',{edit:true,hl:['c:scroll-snap-type']});
 }
};

/* gerçek video / ses üretimi (internetsiz) */
let vidURL=null,vidFailed=false;
function makeVideo(cb){
  if(vidURL||vidFailed){cb();return}
  try{
    if(!window.MediaRecorder)throw 0;
    const cv=document.createElement('canvas');cv.width=480;cv.height=270;
    const x=cv.getContext('2d'),stream=cv.captureStream(30);
    const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
    const rec=new MediaRecorder(stream,mime?{mimeType:mime}:{}),ch=[];
    rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    rec.onstop=()=>{vidURL=URL.createObjectURL(new Blob(ch,{type:rec.mimeType||'video/webm'}));cb()};
    const t0=performance.now();
    const iv=setInterval(()=>{const t=(performance.now()-t0)/1000;
      x.fillStyle='#1b1b3a';x.fillRect(0,0,480,270);x.fillStyle='#ffd166';x.beginPath();x.arc(60+((t*120)%360),135+Math.sin(t*4)*60,26,0,7);x.fill();
      x.fillStyle='#fff';x.font='bold 26px Arial';x.fillText('Robotik Kulübü',20,40);
      if(t>=3){clearInterval(iv);rec.stop()}},33);
    rec.start();
  }catch(e){vidFailed=true;cb()}
}
let audURL=null;
function makeAudio(){
  if(audURL)return audURL;
  const sr=16000,notes=[392,494,587,784,587,494,392,330],dur=0.3,n=sr*dur*notes.length,buf=new DataView(new ArrayBuffer(44+n*2));
  const ws=(o,s)=>[...s].forEach((c,i)=>buf.setUint8(o+i,c.charCodeAt(0)));
  ws(0,'RIFF');buf.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');buf.setUint32(16,16,true);buf.setUint16(20,1,true);buf.setUint16(22,1,true);buf.setUint32(24,sr,true);buf.setUint32(28,sr*2,true);buf.setUint16(32,2,true);buf.setUint16(34,16,true);ws(36,'data');buf.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const k=Math.floor(i/(sr*dur)),t=(i%(sr*dur))/sr,env=Math.min(1,t*30)*Math.exp(-t*5);buf.setInt16(44+i*2,Math.sin(2*Math.PI*notes[k]*i/sr)*env*9000,true)}
  audURL=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));return audURL;
}

/* ---------- slaytları kur ---------- */
const stage=$('#stage');
S.forEach((s,idx)=>{
  const el=document.createElement('section');el.className='slide '+(s.t==='hero'?'hero':s.t==='sec'?'sec':s.t==='app'?'app':'');
  el.dataset.title=(s.h||'').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>');el.dataset.mod=s.mod;
  let h='<span class="mod">'+esc(s.mod)+'</span>';
  if(s.t==='sec')h+='<div class="big">'+s.em+'</div>';
  h+='<h2 class="h">'+s.h+'</h2>';
  if(s.say)h+='<p class="say">'+s.say+'</p>';
  if(s.bn)h+='<p class="bn">'+s.bn+'</p>';
  el.innerHTML=h;
  const body=document.createElement('div');body.className='body';
  if(s.t==='hero'||s.t==='sec'){el.appendChild(body);body.style.display='none'}
  else el.appendChild(body);
  s.el=el;s.body=body;s.built=false;
  stage.appendChild(el);
});
function buildSlide(s){
  if(s.built)return;s.built=true;const b=s.body;
  if(s.t==='cards'){b.innerHTML='<div class="cards" style="--n:'+Math.min(s.n,3)+'">'+s.items.map(i=>'<div class="card"><div class="em">'+i[0]+'</div><b>'+i[1]+'</b><span>'+i[2]+'</span></div>').join('')+'</div>'}
  else if(s.t==='list'){b.innerHTML='<div class="list '+(s.cls||'')+'">'+s.items.map(i=>'<div class="it"><span class="em">'+i[0]+'</span><span>'+i[1]+'</span></div>').join('')+'</div>'}
  else if(s.t==='cr'){
    const o={hl:s.hl,note:s.note,css:s.css,run:s.run,fs:3,off:s.off};
    /* parça slaytları: parçayı tek başına değil, bütün sayfa içinde göster */
    if(s.ctx){o.region=s.ctx;o.outline=s.ctx;o.fs=1.5;s.code=s.ctx==='figure'?CLUB_FIG:CLUB_SEM}
    if(s.media==='video'){
      const cr=document.createElement('div');cr.className='cr';b.appendChild(cr);
      let curCode=s.code;
      const col=document.createElement('div');col.className='col';const cp=mkPane(s.code,{hl:s.hl});col.appendChild(cp.el);
      if(s.note){const bl=document.createElement('div');bl.className='balloon';bl.innerHTML=s.note;col.appendChild(bl)}
      cr.appendChild(col);
      const mp=document.createElement('div');mp.className='pane';mp.innerHTML='<div class="pane-h"><span>Sonuç (gerçek video)</span></div><div class="mediabox"></div>';cr.appendChild(mp);
      const fill=()=>{const box=$('.mediabox',mp);box.innerHTML='';if(vidFailed){box.textContent='Demo video üretilemedi';return}if(!vidURL){makeVideo(fill);return}
        const v=document.createElement('video');v.preload='metadata';v.src=vidURL;v.controls=/controls/.test(curCode);if(/poster=/.test(curCode))v.poster=svgImg(480,270,'Video kapağı','#e07a00');box.appendChild(v);
        if(!v.controls){const n=document.createElement('div');n.className='hintw';n.textContent='controls yok: oynat düğmesi görünmez';box.appendChild(n)}};
      if(s.off)offSeg(b,cr,on=>{curCode=on?s.code:s.code.replace(new RegExp(s.off),'');cp.set(curCode,on?s.hl:[]);if(s.lazyDone)fill()});
      s.lazy=fill;
    }else codeRes(b,s.code,o);
    if(s.extra)b.insertAdjacentHTML('afterbegin',s.extra());
  }
  else if(s.t==='app'){
    b.innerHTML='<div class="appbox"><div class="c"><h3>📚 Şimdiye kadar öğrendiklerimiz</h3><ul>'+s.know.map(k=>'<li><code>'+k[0]+'</code> <small>('+k[1]+')</small></li>').join('')+'</ul></div><div class="c"><h3>🎯 Hedef</h3><p>'+s.goal+'</p><h3>⏱️ Süre önerisi</h3><p>'+s.time+'</p></div></div><a class="appbtn" target="_blank" rel="noopener" href="Hafta-07-Ek-Uygulamalar-Yerlesim-ve-Medya.html#uygulama-'+s.n+'">Ek uygulamalar dosyasını aç &rarr; '+s.n+'. sekme</a><p class="hintw" style="color:#fff">Bitmiş siteye bak, kendi editöründe baştan yaz. Bitirince sunuya dön ve devam et.</p>'}
  else if(s.t==='cmp'){
    const g=document.createElement('div');g.className='cr';b.appendChild(g);
    [s.a,s.b].forEach(x=>{
      const col=document.createElement('div');col.className='col';
      col.innerHTML='<span class="lbl '+x.cls+'">'+(x.cls==='bad'?'✗ ':x.cls==='good'?'✓ ':'')+x.lbl+'</span>';
      col.appendChild(mkPane(x.code,{name:'Kod'}).el);
      if(s.run!==false)col.appendChild(mkRes(x.code,{css:x.css||'club',fs:2.8}).el);
      g.appendChild(col);
    });
  }
  else if(s.t==='result'){
    const r=mkRes(s.code(),{fs:s.fs,cols:s.cols});r.el.style.flex='1';b.appendChild(r.el);
  }
  else if(s.t==='demo'){DEMOS[s.build](b)}
}

/* ---------- gezinme ---------- */
let cur=0;
const KEY='web-h7-son-slayt-v6';
function buildMenu(){
  const m=$('#menu');m.innerHTML='';let last='';
  S.forEach((s,i)=>{if(s.mod!==last){last=s.mod;m.insertAdjacentHTML('beforeend','<div class="mh">'+esc(last)+'</div>')}
    const b=document.createElement('button');b.className='mi'+(i===cur?' cur':'');b.innerHTML='<span class="n">'+(i+1)+'</span><span>'+esc(S[i].el.dataset.title)+'</span>';
    b.onclick=()=>{go(i);m.classList.remove('open')};m.appendChild(b)});
}
function go(i){
  i=Math.max(0,Math.min(S.length-1,i));
  S.forEach((s,k)=>{s.el.classList.toggle('active',k===i);s.el.classList.toggle('past',k<i)});
  cur=i;buildSlide(S[i]);if(S[i+1])setTimeout(()=>buildSlide(S[i+1]),400);
  if(S[i].lazy&&!S[i].lazyDone){S[i].lazyDone=true;S[i].lazy()}
  $('#counter').textContent=(i+1)+' / '+S.length;
  $('#prog').style.width=((i+1)/S.length*100)+'%';
  $('#prev').disabled=i===0;$('#next').disabled=i===S.length-1;
  document.title='Hafta 7 - '+S[i].el.dataset.title;
  try{localStorage.setItem(KEY,String(i))}catch(e){}
  $$('.mi').forEach((x,k)=>x.classList.toggle('cur',k===i));
}
$('#next').onclick=()=>go(cur+1);$('#prev').onclick=()=>go(cur-1);
$('#bMenu').onclick=()=>$('#menu').classList.toggle('open');
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);
  else if(e.key==='m'||e.key==='M')$('#bMenu').click();
  else if(e.key==='t'||e.key==='T')$('#bTheme').click();
  else if(e.key==='Escape')$('#menu').classList.remove('open');
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(e.target.closest('textarea,input,iframe,pre,.mediabox,.tree,.drawer'))return;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1))},{passive:true});
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('web-tema',t)}catch(e){}}
let th=null;try{th=localStorage.getItem('web-tema')}catch(e){}
if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
setTheme(th);
$('#bTheme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
buildMenu();
let start=0;try{start=parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){}
go(start);
</script>

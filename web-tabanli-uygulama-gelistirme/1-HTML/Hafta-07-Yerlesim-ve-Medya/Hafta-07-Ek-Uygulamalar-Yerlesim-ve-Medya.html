function iskelet(a){

}
/* internetsiz örnek görseller */
function svg(label){
  const s='<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#1b1b3a"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="380" cy="70" r="32" fill="#ffd166"/><path d="M0 270 L140 160 L240 220 L340 140 L480 270Z" fill="rgba(255,255,255,.2)"/><text x="50%" y="250" text-anchor="middle" font-family="Arial" font-size="22" fill="#fff">'+label+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
function prep(code){
  code=code.replace(/<source[^>]*\.(mp4|mp3)"[^>]*>/g,'');
  return code.replace(/(src|poster)="([^"]+\.(jpg|jpeg|png))"/g,(m,a,n)=>a+'="'+svg(n.split('/').pop())+'"');
}
function doc(code){
  const full=/<html[\s>]/i.test(code);

  if(full)return prep(code).replace('</head>',base+'</head>');
  return '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">'+base+'</head><body style="margin:8px">'+prep(code)+'</body></html>';
}

const GIZLI=new Set(['html','head','style','title','meta','link','script','source']);
const VOID=new Set('area base br col embed hr img input link meta source track wbr'.split(' '));
function parse(code){
  const els=[],st=[],low=code.toLowerCase();
  const re=/<\!--[\s\S]*?--\>|<(\/?)([a-zA-Z][\w-]*)((?:"[^"]*"|'[^']*'|[^>"'])*)>/g;let m;
  while((m=re.exec(code))){
    if(m[0].slice(0,4)==='<'+'!--')continue;
    const nm=m[2].toLowerCase();
    if(!m[1]){
      const e={i:els.length,n:nm,s:m.index,oe:m.index+m[0].length,e:m.index+m[0].length,ins:m.index+1+m[2].length};
      els.push(e);
      if(VOID.has(nm)||/\/\s*$/.test(m[3]))continue;
      st.push(e);
      if(nm==='style'||nm==='script'){const c=low.indexOf('</'+nm,re.lastIndex);if(c>=0)re.lastIndex=c}
    }else{
      for(let j=st.length-1;j>=0;j--)if(st[j].n===nm){
        for(let k=j+1;k<st.length;k++)if(st[k].e===st[k].oe)st[k].e=m.index;
        st[j].e=m.index+m[0].length;st.length=j;break}
    }
  }
  return els;
}
function enIc(els,a,b){let best=null;for(const e of els)if(e.s<=a&&b<=e.e&&(!best||e.e-e.s<=best.e-best.s))best=e;return best}
function isaretle(code){

  for(let k=els.length-1;k>=0;k--)out=out.slice(0,els[k].ins)+' data-i="'+k+'"'+out.slice(els[k].ins);
  return out;
}
const FR_JS='<style>[data-hl]{outline:.2em dashed #f59e0b!important;outline-offset:-.1em;box-shadow:0 0 0 .3em rgba(245,158,11,.4)!important}</style><scr'+'ipt>(function(){var cur=null;'+
 'addEventListener("message",function(e){var d=e.data;if(!d||d.t!=="hl")return;if(cur)cur.removeAttribute("data-hl");cur=null;if(d.i>=0){var el=document.querySelector("[data-i=\\""+d.i+"\\"]");if(el){el.setAttribute("data-hl","");cur=el;var r=el.getBoundingClientRect();parent.postMessage({t:"pos",y:r.top+scrollY,h:r.height},"*")}}});'+
 'document.addEventListener("click",function(e){var t=e.target.closest?e.target:e.target.parentElement;var a=t.closest("a");if(a)e.preventDefault();var h=t.closest("[data-i]");parent.postMessage({t:"pick",i:h?+h.getAttribute("data-i"):-1},"*")},true);'+
 'function hh(){parent.postMessage({t:"h",h:Math.ceil(document.documentElement.getBoundingClientRect().height)},"*")}if(window.ResizeObserver)new ResizeObserver(hh).observe(document.documentElement);addEventListener("load",hh);hh();parent.postMessage({t:"ready"},"*")})()<\/script>';
function onizleme(code){
  const h=doc(isaretle(code));const x=h.toLowerCase().lastIndexOf('</body>');
  return x<0?h+FR_JS:h.slice(0,x)+FR_JS+h.slice(x);
}
const LH=21,PAD=10;

const EDS=[];
window.addEventListener('message',e=>{for(const d of EDS)if(e.source===d.fr.contentWindow){d.msg(e.data);return}});

/* Salt okunur kod + canlı önizleme bloğu */
function mkEd(root,o){
  root.innerHTML=
   '<div class="grid"><div class="pane codepane"><div class="pane-h"><span>Kod (salt okunur)</span><span><button class="btn cs">CSS\'i katla</button> <button class="btn cc">Yalnız CSS\'i kopyala</button> <button class="btn cp">Kopyala</button></span></div>'+
   '<div class="info">İmleci koda koy ya da sonuçta bir yere tıkla; ilgili etiket işaretlenir.</div>'+
   '<div class="cw"><div class="ov"></div><textarea spellcheck="false" wrap="off" readonly></textarea></div></div>'+
   '<div class="pane prev"><div class="pane-h"><span>Sonuç (tüm sayfa)</span><button class="btn kg">👁 Kodu gizle</button></div><div class="pv"><iframe sandbox="allow-scripts" title="Sonuç" scrolling="no"></iframe></div></div></div>';
  const q=s=>root.querySelector(s);
  const ta=q('textarea'),fr=q('iframe'),ov=q('.ov'),info=q('.info'),gr=q('.grid'),pv=q('.pv');
  ta.value=o.kod;
  const F={on:false,hidden:'',ph:''};
  const full=()=>F.on?ta.value.replace(F.ph,()=>F.hidden):ta.value;
  const pi=()=>F.on?ta.value.indexOf(F.ph):-1;
  const toView=x=>{const p=pi();if(p<0)return x;const L=F.hidden.length;return x<=p?x:x<p+L?p:x-L+F.ph.length};
  const lineOf=x=>{const v=ta.value;let n=0;for(let i=v.indexOf('\n');i>=0&&i<x;i=v.indexOf('\n',i+1))n++;return n};
  let curI=-1,band=null,sc=1,ch=600;
  /* önizleme ölçeği: mantıksal genişlik 1000px (dar ekranda 600px), kutuya sığdırılır */
  const fit=()=>{
    const cw=pv.clientWidth||600,W=cw>=700?1000:600;
    sc=Math.min(1,cw/W);
    fr.style.width=W+'px';fr.style.height=ch+'px';
    fr.style.transform='scale('+sc+')';pv.style.height=Math.ceil(ch*sc)+'px';
  };
  if(window.ResizeObserver)new ResizeObserver(fit).observe(pv);
  addEventListener('resize',fit);
  const draw=b=>{ov.innerHTML=b?'<div class="bd" style="top:'+(PAD+b[0]*LH)+'px;height:'+((b[1]-b[0]+1)*LH)+'px"></div>':'';ov.style.transform='translateY('+(-ta.scrollTop)+'px)'};
  const send=()=>{const e=parse(full())[curI];try{fr.contentWindow.postMessage({t:'hl',i:e&&!GIZLI.has(e.n)?curI:-1},'*')}catch(x){}};
  const vurgu=(i,kaydir)=>{
    curI=i;const e=parse(full())[i];
    if(!e){band=null;draw(null);info.textContent='İmleci koda koy ya da sonuçta bir yere tıkla; ilgili etiket işaretlenir.';send();return}
    const l1=lineOf(toView(e.s)),l2=lineOf(toView(Math.max(e.s,e.e-1)));
    band=[l1,l2];draw(band);
    if(kaydir)ta.scrollTop=Math.max(0,PAD+l1*LH-ta.clientHeight/3);
    info.innerHTML='İmleç: <code>&lt;'+e.n+'&gt;</code> — '+(TAGS[e.n]||'bu etiket için kısa açıklama yok')+(GIZLI.has(e.n)?' (ekranda görünmez)':'')+' <small>· satır '+(l1+1)+(l2>l1?'–'+(l2+1):'')+'</small>';
    send();
  };
  const imlec=()=>{
    const els=parse(full());const p=pi();
    const fo=x=>{if(p<0)return x;const L=F.hidden.length,pl=F.ph.length;return x<=p?x:x<p+pl?p:x-pl+L};
    const e=enIc(els,fo(ta.selectionStart),fo(ta.selectionEnd));
    vurgu(e?e.i:-1,false);
  };
  /* vurgulanan eleman sayfada görünür değilse sayfayı kaydır */
  const goster=(y,h)=>{
    const top=fr.getBoundingClientRect().top+y*sc,bot=top+h*sc;
    if(top<60||bot>innerHeight-20)window.scrollTo({top:Math.max(0,scrollY+top-innerHeight/2+Math.min(h*sc,innerHeight/3)/2),behavior:'smooth'});
  };
  EDS.push({fr:fr,msg:d=>{
    if(!d)return;
    if(d.t==='ready')send();
    else if(d.t==='pick'&&d.i>=0)vurgu(d.i,true);
    else if(d.t==='h'){ch=Math.max(300,d.h);fit()}
    else if(d.t==='pos'&&document.activeElement===ta)goster(d.y,d.h);
  }});
  ['keyup','mouseup','focus'].forEach(ev=>ta.addEventListener(ev,imlec));
  ta.addEventListener('scroll',()=>{ov.style.transform='translateY('+(-ta.scrollTop)+'px)'});
  const katla=on=>{
    if(on){const m=/<style[\s\S]*?<\/style>/i.exec(ta.value);if(!m)return;
      F.hidden=m[0];F.ph='<style>/* '+m[0].split('\n').length+' satır CSS gizli. "CSS\'i göster" ile aç */</style>';
      ta.value=ta.value.replace(m[0],()=>F.ph);F.on=true;q('.cs').textContent='CSS\'i göster'}
    else if(F.on){ta.value=full();F.on=false;q('.cs').textContent='CSS\'i katla'}
    vurgu(curI,false);
  };
  q('.cs').onclick=()=>katla(!F.on);
  const kopya=(b,txt,ad)=>{const d=()=>{b.textContent='Kopyalandı';setTimeout(()=>b.textContent=ad,1200)};const fb=()=>{const x=document.createElement('textarea');x.value=txt;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(z){}x.remove();d()};if(navigator.clipboard)navigator.clipboard.writeText(txt).then(d,fb);else fb()};
  q('.cp').onclick=e=>kopya(e.target,full(),'Kopyala');
  q('.cc').onclick=e=>{const m=/<style[\s\S]*?<\/style>/i.exec(full());kopya(e.target,m?m[0]:'','Yalnız CSS\'i kopyala')};
  const gizle=g=>{gr.classList.toggle('hc',g);q('.kg').textContent=g?'👁 Kodu göster':'👁 Kodu gizle';try{localStorage.setItem('h7ek4-gizle',g?'1':'0')}catch(e){}setTimeout(fit,0)};
  q('.kg').onclick=()=>gizle(!gr.classList.contains('hc'));
  let g=false;try{g=localStorage.getItem('h7ek4-gizle')==='1'}catch(e){}
  gizle(g);
  katla(true);
  fr.srcdoc=onizleme(full());
  fit();
}

function show(k){
  const a=APPS[k];EDS.length=0;
  $('#tabs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===k));
  $('#app').innerHTML=
   '<div class="card"><h2>Nasıl çalışacağız?</h2><ol class="steps"><li>Aşağıdaki <b>bitmiş siteyi</b> incele: koda imleç koy ya da sonuçta bir yere tıkla; turuncu işaret kod ile sayfayı eşleştirir.</li><li>Bilgisayarında bir klasör aç; VS Code ile içine <code>index.html</code> dosyasını oluştur.</li><li>&quot;Yalnız CSS&#39;i kopyala&quot; düğmesiyle hazır stili al, kendi dosyanın <code>head</code> bölümüne yapıştır. Class adları hedefle aynıdır.</li><li>Aşağıdaki <b>Yapılacaklar</b> listesini sırayla uygula. Kod verilmez; hangi etiketi kullanacağın yazar.</li><li>Her adımdan sonra dosyayı kaydet, tarayıcıda yenile ve hedefle karşılaştır.</li></ol></div>'+
   '<div class="card"><h2>'+a.ad+'</h2><p>'+a.ozet+'</p>'+
   '<div class="weeks">'+a.haftalar.map(h=>'<span>'+h+'</span>').join('')+'</div>'+
   '<b>Yapılacaklar</b><ol class="steps">'+a.adimlar.map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'+
   '<h3 class="hh">🎯 Hedef: bitmiş site</h3><div id="eh"></div>';
  mkEd($('#eh'),{kod:iskelet(a)});
  try{localStorage.setItem('h7ek-son',k)}catch(e){}
}
APPS.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a.ad;b.onclick=()=>show(i);$('#tabs').appendChild(b)});
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('web-tema',t)}catch(e){}}
let th=null;try{th=localStorage.getItem('web-tema')}catch(e){}
setTheme(th||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#th').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let st=0;try{st=+localStorage.getItem('h7ek-son')||0}catch(e){}
const hm=location.hash.match(/uygulama-(\d)/);if(hm&&APPS[hm[1]-1])st=hm[1]-1;
show(st);
</script>
</body>
</html>

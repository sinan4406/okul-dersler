<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Etiketleri Rehberi</title>
<meta name="description" content="HTML dersinde ezberlenmesi gereken tüm etiketler: sunum, ezber kartları, test ve yazarak çalışma.">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202f;--mute:#5b667a;--line:#e2e7f0;--code:#0f172a;--codeink:#e5e9f5;--shadow:0 1px 2px rgba(20,30,60,.06),0 10px 30px rgba(20,30,60,.09);--ok:#0e9f6e;--okbg:#e3f7ef;--bad:#e11d48;--badbg:#fde8ed;--c:#2f5bea;--cbg:#e9efff;--tg:#7dd3fc;--at:#fcd34d;--st:#86efac;--cm:#94a3b8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131b;--card:#181e2a;--ink:#eaeef6;--mute:#9aa6bb;--line:#273044;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--okbg:#12342a;--badbg:#3a1822;--cbg:#1f2943}}
:root[data-theme="dark"]{--bg:#0f131b;--card:#181e2a;--ink:#eaeef6;--mute:#9aa6bb;--line:#273044;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--okbg:#12342a;--badbg:#3a1822;--cbg:#1f2943}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:-.01em;font-size:1.05rem;white-space:nowrap}
.logo b{color:var(--c)}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:99px;font-weight:700;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.icon{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-weight:700}
.back{font-size:.85rem;color:var(--mute);text-decoration:none;font-weight:600}
.back:hover{color:var(--c)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
.hidden{display:none!important}
/* slide */
.stagebar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.progress{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .25s}
.count{font-size:.9rem;color:var(--mute);min-width:70px;text-align:right}
.slide{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border-top:6px solid var(--c);padding:28px 32px;min-height:460px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.progress i{transition:none}}
.eyebrow{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--cbg);color:var(--c);font-weight:800;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.slide h1,.slide h2{margin:10px 0 8px;letter-spacing:-.02em;line-height:1.15}
.slide h1{font-size:clamp(2rem,5vw,3.2rem)}
.slide h2{font-size:clamp(1.5rem,3.2vw,2.1rem)}
.lead{color:var(--mute);font-size:1.1rem;max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 12px;font-weight:700;font-size:.9rem}
button.chip:hover{border-color:var(--c);color:var(--c)}
.chip.yes{background:var(--okbg);border-color:transparent;color:var(--ok)}
.chip.no{background:var(--badbg);border-color:transparent;color:var(--bad)}
.chip.mid{background:var(--cbg);border-color:transparent;color:var(--c)}
.tagslide{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;margin-top:6px}
@media (max-width:860px){.tagslide{grid-template-columns:1fr}.slide{padding:20px 18px}}
.tagname{font-family:ui-monospace,Consolas,monospace;font-size:clamp(2rem,5vw,3.1rem);font-weight:800;color:var(--c);line-height:1.1;word-break:break-word}
.ac{color:var(--mute);margin:2px 0 12px}
.gorev{font-size:1.15rem;margin:10px 0 14px}
.box{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.97rem}
.box b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.tip{background:var(--cbg)}
.warn{background:var(--badbg)}
.attrs{margin:10px 0;padding:0;list-style:none}
.attrs li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.attrs code{background:var(--cbg);color:var(--c);padding:1px 7px;border-radius:6px;font-weight:700;font-size:.88rem}
pre.code{background:var(--code);color:var(--codeink);border-radius:14px;padding:16px 18px;margin:0 0 12px;overflow:auto;font-size:.92rem;line-height:1.6;tab-size:2}
.tg{color:var(--tg)}.at{color:var(--at)}.st{color:var(--st)}.cm{color:var(--cm);font-style:italic}
.pvl{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:8px 0 4px}
.preview{width:100%;height:170px;border:1px solid var(--line);border-radius:12px;background:#fff}
.sonuc{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--mute);background:var(--bg)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.btn{border:0;background:var(--c);color:#fff;padding:10px 20px;border-radius:12px;font-weight:800}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.menu{position:fixed;inset:0 auto 0 0;width:min(340px,92vw);background:var(--card);box-shadow:var(--shadow);z-index:40;padding:18px;overflow:auto;transform:translateX(-105%);transition:transform .2s}
.menu.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.menu h3{margin:14px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.menu button.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:8px;font-weight:600}
.menu button.item:hover{background:var(--cbg)}
.menu button.item.seen::after{content:" ✓";color:var(--ok)}
.menu button.item.cur{background:var(--cbg);color:var(--c)}
table.t{width:100%;border-collapse:collapse;font-size:.95rem;margin:10px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
table.t td:first-child{font-family:ui-monospace,Consolas,monospace;font-weight:800;color:var(--c);white-space:nowrap}
.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:24px 28px}
.panel h2{margin:0 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}
select,input[type=text]{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]{min-width:min(100%,280px);font-family:ui-monospace,Consolas,monospace;font-size:1.1rem}
.flash{perspective:1000px;margin:14px 0}
.fc{min-height:260px;border-radius:20px;border:2px solid var(--c);background:var(--card);padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:var(--shadow);width:100%}
.fc .big{font-family:ui-monospace,Consolas,monospace;font-size:clamp(1.8rem,5vw,3rem);font-weight:800;color:var(--c)}
.fc .role{font-size:1.4rem;font-weight:700}
.fc .small{color:var(--mute);margin-top:8px}
.fc pre.code{text-align:left;margin-top:14px;max-width:100%}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin:14px 0}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 16px;text-align:left;font-weight:700}
.opt.mono{font-family:ui-monospace,Consolas,monospace}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.qtext{font-size:1.3rem;font-weight:700;margin:6px 0}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.score{font-size:3rem;font-weight:800;color:var(--c)}
.blur{filter:blur(6px);cursor:pointer;user-select:none}
.muted{color:var(--mute)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;color:var(--mute)}
.stats b{display:block;font-size:1.8rem;color:var(--ink)}
.mist li{margin:4px 0}
@media print{.top,.nav,.row,.stagebar,.menu,.scrim,.noprint{display:none!important}body{background:#fff;color:#000}.panel{box-shadow:none;padding:0}main{padding:0}table.t td:first-child{color:#000}.blur{filter:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo"><b>&lt;/&gt;</b> HTML Etiketleri</div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <a class="back noprint" href="../../index.html">← Web dersi</a>
  <button class="icon" id="themeBtn" title="Açık / koyu tema" aria-label="Tema değiştir">◐</button>
</div></header>

<main>
  <section id="m-sunum">
    <div class="stagebar">
      <button class="icon" id="menuBtn" aria-label="İçindekiler">☰ İçindekiler</button>
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <div class="count" id="count"></div>
      <button class="icon" id="fsBtn" title="Tam ekran (F)" aria-label="Tam ekran">⛶</button>
    </div>
    <article class="slide" id="slide" aria-live="polite"></article>
    <div class="nav">
      <button class="btn ghost" id="prev">← Önceki</button>
      <span class="muted" style="font-size:.85rem">Ok tuşları · Boşluk · kaydırma (telefon)</span>
      <button class="btn" id="next">Sonraki →</button>
    </div>
  </section>
  <section id="m-kartlar" class="hidden"></section>
  <section id="m-test" class="hidden"></section>
  <section id="m-yaz" class="hidden"></section>
  <section id="m-ozet" class="hidden"></section>
</main>

<div class="scrim hidden" id="scrim"></div>
<aside class="menu" id="menu" aria-label="İçindekiler"></aside>

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const gOf = id=>GROUPS.find(g=>g.id===id);
const KAP = {var:["Kapanış etiketi VAR","yes"], yok:["Kapanışı YOK (boş element)","no"], özel:["Kendi kapanışı: --> ","mid"]};
const norm = s=>s.toLowerCase().replace(/[<>\/\s]/g,"");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hl(code){
  return code.replace(/(<!--[\s\S]*?-->)|(<\/?[!A-Za-z][^>]*>)|([^<]+|<)/g,(m,c,t,x)=>{
    if(c) return '<span class="cm">'+esc(c)+'</span>';
    if(t){
      const mm=t.match(/^<(\/?)([^\s>\/]+)([\s\S]*?)(\/?)>$/);
      if(!mm) return esc(t);
      const attrs=mm[3].replace(/([A-Za-z_:][\w:.-]*)(="[^"]*")?/g,(a,n,v)=>'<span class="at">'+esc(n)+'</span>'+(v?'=<span class="st">'+esc(v.slice(1))+'</span>':''));
      return '<span class="tg">&lt;'+mm[1]+esc(mm[2])+'</span>'+attrs+'<span class="tg">'+mm[4]+'&gt;</span>';
    }
    return esc(m);
  });
}
const PLACE = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="#c7d2fe"/><text x="150" y="108" font-family="Arial" font-size="22" text-anchor="middle" fill="#312e81">Görsel</text></svg>');
function previewDoc(tag){
  let body = tag.onizleme || tag.code;
  body = body.replace(/(src|poster)="[^"]+\.(jpg|png|webp)"/g,'$1="'+PLACE+'"');
  return '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><style>body{font:15px/1.5 system-ui,sans-serif;margin:12px;color:#17202f;background:#fff}img{max-width:100%;height:auto}table,th,td{border:1px solid #94a3b8;border-collapse:collapse;padding:5px 9px}</style></head><body>'+body+'</body></html>';
}

function setMode(m,keepHash){
  mode=m;

const SLIDES = [];

GROUPS.forEach(g=>{
  SLIDES.push({type:"group",g:g.id});

});

function chipsFor(gid){
  return TAGS.filter(t=>t.g===gid).map(t=>{
    const i=SLIDES.findIndex(s=>s.tag===t);
    return '<button class="chip" data-go="'+i+'">'+esc(t.t)+'</button>';
  }).join("");
}

      : '<pre class="code">'+hl(t.code)+'</pre><div class="pvl">Ekranda böyle görünür</div><iframe class="preview" sandbox="" title="Örnek sonuç"></iframe>'+(t.sonuc?'<div class="sonuc" style="margin-top:8px">'+esc(t.sonuc)+'</div>':"");

function renderSlide(i,noHash){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  const s=SLIDES[cur], el=$("#slide");
  const g = s.g? gOf(s.g) : (s.tag? gOf(s.tag.g) : null);
  const col = g? g.renk : "#2f5bea";
  el.style.setProperty("--c",col);el.style.borderTopColor=col;
  el.style.setProperty("--cbg",col+"22");
  el.innerHTML=slideHTML(s);
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>renderSlide(+b.dataset.go));
  el.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  const ifr=$("iframe.preview",el); if(ifr) ifr.srcdoc=previewDoc(s.tag);
  if(s.type==="recap"){
    const hb=$("#hideBtn",el), roles=el.querySelectorAll("td.role");
    hb.onclick=()=>{const on=hb.dataset.on!=="1";hb.dataset.on=on?"1":"";hb.textContent=on?"Görevleri göster":"Görevleri gizle";
      roles.forEach(r=>r.classList.toggle("blur",on));};
    roles.forEach(r=>r.onclick=()=>r.classList.remove("blur"));
  }
  S.seen[cur]=1; save();
  $("#prog").style.width=(cur/(SLIDES.length-1)*100)+"%";
  $("#count").textContent=(cur+1)+" / "+SLIDES.length;
  $("#prev").disabled=cur===0; $("#next").disabled=cur===SLIDES.length-1;
  if(!noHash && mode==="sunum") history.replaceState(null,"","#sunum/"+cur);
  renderMenu();
}
$("#prev").onclick=()=>renderSlide(cur-1);
$("#next").onclick=()=>renderSlide(cur+1);
document.addEventListener("keydown",e=>{
  if(mode!=="sunum"||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();renderSlide(cur+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();renderSlide(cur-1)}
  else if(e.key==="Home"){renderSlide(0)} else if(e.key==="End"){renderSlide(SLIDES.length-1)}
  else if(e.key==="f"||e.key==="F"){toggleFs()}
  else if(e.key==="Escape"){closeMenu()}
});
let tx=null;
$("#slide").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("#slide").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>70) renderSlide(cur+(dx<0?1:-1));});
function toggleFs(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
$("#fsBtn").onclick=toggleFs;

/* menü */
function renderMenu(){
  const m=$("#menu"); let h='<button class="icon" id="closeM" style="float:right">✕</button><h3 style="margin-top:4px">İçindekiler</h3>';
  h+='<button class="item'+(cur===0?" cur":"")+(S.seen[0]?" seen":"")+'" data-i="0">Başlangıç</button><button class="item'+(cur===1?" cur":"")+(S.seen[1]?" seen":"")+'" data-i="1">Nasıl çalışmalı?</button>';
  GROUPS.forEach(g=>{
    const gi=SLIDES.findIndex(s=>s.type==="group"&&s.g===g.id);
    h+='<h3>'+g.konu+' · '+esc(g.ad)+'</h3><button class="item'+(cur===gi?" cur":"")+'" data-i="'+gi+'">Bölüm başlangıcı</button>';
    TAGS.filter(t=>t.g===g.id).forEach(t=>{const i=SLIDES.findIndex(s=>s.tag===t);
      h+='<button class="item mono'+(cur===i?" cur":"")+(S.seen[i]?" seen":"")+'" data-i="'+i+'">'+esc(t.t)+'</button>';});
  });
  const pi=SLIDES.findIndex(s=>s.type==="pairs");
  h+='<h3>Son</h3><button class="item" data-i="'+pi+'">Karıştırılan çiftler</button><button class="item" data-i="'+(SLIDES.length-1)+'">Bitiş</button>';
  m.innerHTML=h;
  m.querySelectorAll("button.item").forEach(b=>b.onclick=()=>{renderSlide(+b.dataset.i);closeMenu()});
  $("#closeM").onclick=closeMenu;
}
function openMenu(){$("#menu").classList.add("open");$("#scrim").classList.remove("hidden")}
function closeMenu(){$("#menu").classList.remove("open");$("#scrim").classList.add("hidden")}
$("#menuBtn").onclick=openMenu;$("#scrim").onclick=closeMenu;

/* ============ KARTLAR ============ */
const CS = {group:"all", only:false, dir:"t2r", deck:[], i:0, flip:false};
function groupSelect(id,val){
  return '<select id="'+id+'"><option value="all">Tüm bölümler</option>'+GROUPS.map(g=>'<option value="'+g.id+'"'+(val===g.id?" selected":"")+'>'+g.konu+' · '+esc(g.ad)+'</option>').join("")+'</select>';
}
function buildDeck(){
  let d=TAGS.filter(t=>CS.group==="all"||t.g===CS.group);
  if(CS.only) d=d.filter(t=>!S.known[t.t]);
  CS.deck=shuffle(d);CS.i=0;CS.flip=false;
}
function renderCards(){
  const el=$("#m-kartlar");
  const known=TAGS.filter(t=>S.known[t.t]).length;
  el.innerHTML=`<div class="panel"><h2>Ezber kartları</h2>
  <p class="muted">Kartı çevirmek için karta tıkla (veya Boşluk). Biliyorsan “Biliyorum”, bilmiyorsan “Tekrar”.</p>
  <div class="row">${groupSelect("cg",CS.group)}
    <select id="cd"><option value="t2r"${CS.dir==="t2r"?" selected":""}>Etiket → görevi söyle</option><option value="r2t"${CS.dir==="r2t"?" selected":""}>Görev → etiketi söyle</option></select>
    <label><input type="checkbox" id="co"${CS.only?" checked":""}> Sadece bilmediklerim</label>
    <button class="btn ghost" id="cs">Karıştır</button>
    <button class="btn ghost" id="cr">İlerlemeyi sıfırla</button></div>
  <div class="stats"><div><b>${known}/${TAGS.length}</b>“biliyorum”</div><div><b id="cpos"></b>bu destede</div></div>
  <div id="cardArea"></div></div>`;
  $("#cg").onchange=e=>{CS.group=e.target.value;buildDeck();drawCard()};
  $("#cd").onchange=e=>{CS.dir=e.target.value;CS.flip=false;drawCard()};
  $("#co").onchange=e=>{CS.only=e.target.checked;buildDeck();drawCard()};
  $("#cs").onclick=()=>{buildDeck();drawCard()};
  $("#cr").onclick=()=>{if(confirm("Tüm “biliyorum” işaretleri silinsin mi?")){S.known={};save();buildDeck();renderCards()}};
  if(!CS.deck.length||CS.i>=CS.deck.length) buildDeck();
  drawCard();
}
function drawCard(){
  const a=$("#cardArea"); if(!a) return;
  $("#cpos").textContent=CS.deck.length?(CS.i+1)+" / "+CS.deck.length:"0";
  if(!CS.deck.length){a.innerHTML='<div class="fb ok">Bu seçimde kart kalmadı. Harika! 🎉 Filtreyi değiştirebilir veya ilerlemeyi sıfırlayabilirsin.</div>';return}
  const t=CS.deck[CS.i], g=gOf(t.g);
  let front,back;
  if(CS.dir==="t2r"){front='<div class="big">'+esc(t.t)+'</div><div class="small">'+g.konu+' · '+esc(g.ad)+'</div>';
    back='<div class="big" style="font-size:1.6rem">'+esc(t.t)+'</div><div class="role">'+esc(t.k)+'</div><div class="small">'+esc(t.ac)+' · '+(KAP[t.kapanis]||KAP.var)[0]+'</div><pre class="code">'+hl(t.code)+'</pre><div class="small">'+esc(t.ipucu)+'</div>';}
  else{front='<div class="role">'+esc(t.k)+'</div><div class="small">Hangi etiket? ('+g.konu+' · '+esc(g.ad)+')</div>';
    back='<div class="big">'+esc(t.t)+'</div><div class="small">'+esc(t.ac)+' · '+(KAP[t.kapanis]||KAP.var)[0]+'</div><pre class="code">'+hl(t.code)+'</pre>';}
  a.innerHTML='<div class="flash"><button class="fc" id="fc" style="border-color:'+g.renk+'" aria-label="Kartı çevir">'+(CS.flip?back:front)+'</button></div>'+
  '<div class="row"><button class="btn ghost" id="cb">← Geri</button><button class="btn ghost" id="cf">Çevir</button><span style="flex:1"></span><button class="btn bad" id="ca">↻ Tekrar</button><button class="btn ok" id="ck">✓ Biliyorum</button></div>';
  $("#fc").onclick=$("#cf").onclick=()=>{CS.flip=!CS.flip;drawCard()};
  $("#cb").onclick=()=>{CS.i=(CS.i-1+CS.deck.length)%CS.deck.length;CS.flip=false;drawCard()};
  $("#ck").onclick=()=>{S.known[t.t]=true;save();CS.deck.splice(CS.i,1);if(CS.i>=CS.deck.length)CS.i=0;CS.flip=false;renderCardsStatsOnly();drawCard()};
  $("#ca").onclick=()=>{S.known[t.t]=false;save();const x=CS.deck.splice(CS.i,1)[0];CS.deck.push(x);if(CS.i>=CS.deck.length)CS.i=0;CS.flip=false;renderCardsStatsOnly();drawCard()};
}
function renderCardsStatsOnly(){const b=$("#m-kartlar .stats b");if(b)b.textContent=TAGS.filter(t=>S.known[t.t]).length+"/"+TAGS.length}
document.addEventListener("keydown",e=>{
  if(mode!=="kartlar"||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key===" "&&$("#cf")){e.preventDefault();$("#cf").click()}
});

/* ============ TEST ============ */
let Q=null;
function renderTestSetup(){
  const el=$("#m-test");
  const weak=Object.keys(S.weak).filter(k=>S.weak[k]>0).length;
  el.innerHTML=`<div class="panel"><h2>Test</h2>
  <p class="muted">Çoktan seçmeli sorular: görevden etiketi, etiketten görevi, açılımdan etiketi ve kapanış kuralını bil.</p>
  <div class="row">${groupSelect("tg","all")}
   <select id="tn"><option value="10">10 soru</option><option value="20" selected>20 soru</option><option value="40">40 soru</option></select>
   <label><input type="checkbox" id="tw"> Zayıf olduklarımdan başla (${weak})</label>
   <button class="btn" id="ts">Başlat</button></div>
  ${S.best!=null?'<p class="muted">En iyi sonucun: <b>%'+S.best+'</b></p>':""}</div>`;
  $("#ts").onclick=()=>startTest($("#tg").value,+$("#tn").value,$("#tw").checked);
}
function pickOpts(correct,pool,n,key){
  const others=shuffle(pool.filter(x=>x!==correct)).slice(0,n-1);
  return shuffle([correct,...others]).map(x=>({v:x,ok:x===correct}));
}
function makeQuestion(t,pool){
  const same=pool.filter(x=>x.g===t.g), mixed=same.length>=4?same:TAGS;
  const types=["g2t","t2g","t2g","ac"];
  if(t.kapanis!=="özel") types.push("kap");
  if(!t.ac) types.splice(types.indexOf("ac"),1);
  const ty=types[Math.floor(Math.random()*types.length)];
  if(ty==="g2t") return {t,type:ty,q:"“"+t.k+"” görevini hangi etiket üstlenir?",mono:true,opts:pickOpts(t,mixed,4).map(o=>({v:o.v.t,ok:o.ok}))};
  if(ty==="t2g") return {t,type:ty,q:t.t+" etiketinin görevi nedir?",mono:false,opts:pickOpts(t,mixed,4).map(o=>({v:o.v.k,ok:o.ok}))};
  if(ty==="ac"){const en=t.ac.split("—")[0].trim();return {t,type:ty,q:"“"+t.ac+"” açılımı hangi etiketindir?",mono:true,opts:pickOpts(t,mixed,4).map(o=>({v:o.v.t,ok:o.ok}))}}
  return {t,type:"kap",q:t.t+" etiketinin kapanış etiketi var mı?",mono:false,opts:[{v:"Evet, kapanış etiketi var",ok:t.kapanis==="var"},{v:"Hayır, boş elementtir (kapanışı yok)",ok:t.kapanis==="yok"},{v:"Evet, ama kendine özgü kapanışı var (-->)",ok:t.kapanis==="özel"}].filter((o,i)=>t.kapanis==="özel"||i<2)};
}
function startTest(gid,n,weakFirst){
  let pool=TAGS.filter(t=>gid==="all"||t.g===gid);
  let picks=shuffle(pool);
  if(weakFirst) picks=picks.sort((a,b)=>(S.weak[b.t]||0)-(S.weak[a.t]||0));
  const qs=[];
  for(let i=0;qs.length<Math.min(n,Math.max(pool.length,n));i++){
    qs.push(makeQuestion(picks[i%picks.length],TAGS));
    if(qs.length>=n) break;
  }
  Q={qs,i:0,score:0,wrong:[],answered:false};
  drawQ();
}
function drawQ(){
  const el=$("#m-test");
  if(Q.i>=Q.qs.length){return endTest()}
  const q=Q.qs[Q.i];
  el.innerHTML=`<div class="panel"><div class="stagebar"><div class="progress"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><div class="count">${Q.i+1} / ${Q.qs.length}</div></div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,i)=>'<button class="opt'+(q.mono?" mono":"")+'" data-i="'+i+'">'+esc(o.v)+'</button>').join("")}</div>
  <div id="fb"></div><div class="row" id="qn"></div></div>`;
  Q.answered=false;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQ(+b.dataset.i));
}
function answerQ(i){
  if(Q.answered) return; Q.answered=true;
  const q=Q.qs[Q.i], ok=q.opts[i].ok;
  document.querySelectorAll("#m-test .opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  if(ok){Q.score++;S.weak[q.t.t]=Math.max(0,(S.weak[q.t.t]||0)-1)}
  else{Q.wrong.push(q);S.weak[q.t.t]=(S.weak[q.t.t]||0)+1}
  save();
  $("#fb").innerHTML='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"Doğru!":"Yanlış.")+'</b> '+esc(q.t.t)+' — '+esc(q.t.k)+'. '+esc(q.t.ipucu)+'</div>';
  $("#qn").innerHTML='<button class="btn" id="nq">'+(Q.i===Q.qs.length-1?"Sonucu gör":"Sonraki soru →")+'</button>';
  $("#nq").onclick=()=>{Q.i++;drawQ()};$("#nq").focus();
}
function endTest(){
  const pct=Math.round(Q.score/Q.qs.length*100);
  if(S.best==null||pct>S.best){S.best=pct;save()}
  const uniq=[...new Map(Q.wrong.map(q=>[q.t.t,q.t])).values()];
  $("#m-test").innerHTML=`<div class="panel"><h2>Sonuç</h2><div class="score">%${pct}</div>
  <p>${Q.qs.length} sorudan <b>${Q.score}</b> tanesini doğru yaptın. ${pct>=85?"Harika, etiketler oturmuş! 🎯":pct>=60?"İyi gidiyorsun; yanlışlarına bir daha bak.":"Sorun değil: kartlarla biraz daha tekrar et."}</p>
  ${uniq.length?'<h3>Tekrar etmen gerekenler</h3><ul class="mist">'+uniq.map(t=>'<li><b class="mono">'+esc(t.t)+'</b> — '+esc(t.k)+'</li>').join("")+'</ul>':""}
  <div class="row"><button class="btn" id="again">Yeni test</button>${uniq.length?'<button class="btn ghost" id="redo">Yanlışlarımı tekrar çöz</button>':""}<button class="btn ghost" data-mode="kartlar" id="tocards">Kartlara git</button></div></div>`;
  $("#again").onclick=renderTestSetup;
  $("#tocards").onclick=()=>setMode("kartlar");
  if($("#redo")) $("#redo").onclick=()=>{Q={qs:shuffle(uniq).map(t=>makeQuestion(t,TAGS)),i:0,score:0,wrong:[],answered:false};drawQ()};
}

/* ============ YAZARAK ============ */
let Y=null;
function renderTypeSetup(){
  $("#m-yaz").innerHTML=`<div class="panel"><h2>Yazarak çalış</h2>
  <p class="muted">Görev gösterilir; etiketin adını yaz (<code>&lt;p&gt;</code> ya da <code>p</code> — ikisi de olur). Başlıklar için <code>h1</code> yazman yeterli.</p>
  <div class="row">${groupSelect("yg","all")}<button class="btn" id="ys">Başlat</button></div></div>`;
  $("#ys").onclick=()=>{const gid=$("#yg").value;Y={list:shuffle(TAGS.filter(t=>gid==="all"||t.g===gid)),i:0,ok:0,miss:[],hint:0,tries:0};drawY()};
}
function drawY(){
  const el=$("#m-yaz");
  if(Y.i>=Y.list.length){
    el.innerHTML=`<div class="panel"><h2>Bitti</h2><div class="score">${Y.ok} / ${Y.list.length}</div><p>İlk denemede doğru bildiklerin sayılır.</p>
    ${Y.miss.length?'<h3>Tekrar et</h3><ul class="mist">'+Y.miss.map(t=>'<li><b class="mono">'+esc(t.t)+'</b> — '+esc(t.k)+'</li>').join("")+'</ul>':'<div class="fb ok">Hiç hata yapmadın! 🎉</div>'}
    <div class="row"><button class="btn" id="yr">Yeniden başla</button></div></div>`;
    $("#yr").onclick=renderTypeSetup;return;
  }
  const t=Y.list[Y.i], g=gOf(t.g);Y.tries=0;Y.hint=0;
  el.innerHTML=`<div class="panel"><div class="stagebar"><div class="progress"><i style="width:${Y.i/Y.list.length*100}%"></i></div><div class="count">${Y.i+1} / ${Y.list.length}</div></div>
  <span class="eyebrow">${g.konu} · ${esc(g.ad)}</span>
  <div class="qtext">${esc(t.k)}</div>
  <p class="muted">${esc(t.gorev)}</p>
  <form id="yf" class="row" autocomplete="off"><input type="text" id="yi" placeholder="etiket adı" aria-label="Etiket adı" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Kontrol et</button><button type="button" class="btn ghost" id="yh">İpucu</button><button type="button" class="btn ghost" id="yp">Geç</button></form>
  <div id="yfb"></div></div>`;
  const inp=$("#yi");inp.focus();
  $("#yf").onsubmit=e=>{e.preventDefault();
    const v=norm(inp.value); if(!v) return;
    if(t.keys.map(norm).includes(v)){
      if(Y.tries===0&&!Y.hint) Y.ok++;
      $("#yfb").innerHTML='<div class="fb ok"><b>Doğru!</b> <span class="mono">'+esc(t.t)+'</span> — '+esc(t.ac)+'</div><div class="row"><button class="btn" id="yn" autofocus>'+(Y.i===Y.list.length-1?"Bitir":"Sonraki →")+'</button></div>';
      inp.disabled=true;$("#yn").onclick=()=>{Y.i++;drawY()};$("#yn").focus();
    }else{
      Y.tries++;
      if(!Y.miss.includes(t)) Y.miss.push(t);
      S.weak[t.t]=(S.weak[t.t]||0)+1;save();
      $("#yfb").innerHTML='<div class="fb bad"><b>Olmadı.</b> Tekrar dene'+(Y.tries>=2?' — ipucu: açılım “'+esc(t.ac)+'”':"")+'.</div>';
      inp.select();
    }};
  $("#yh").onclick=()=>{Y.hint++;const k=t.keys[0].replace(/[<>!]/g,"");
    $("#yfb").innerHTML='<div class="fb bad">İpucu: '+k.length+' harfli, <b class="mono">'+esc(k.slice(0,Y.hint))+"…</b></div>"; if(!Y.miss.includes(t)) Y.miss.push(t); inp.focus()};
  $("#yp").onclick=()=>{if(!Y.miss.includes(t)) Y.miss.push(t);
    $("#yfb").innerHTML='<div class="fb bad">Cevap: <b class="mono">'+esc(t.t)+'</b> — '+esc(t.ac)+'</div><div class="row"><button class="btn" id="yn">Sonraki →</button></div>';
    inp.disabled=true;$("#yn").onclick=()=>{Y.i++;drawY()};$("#yn").focus();};
}

/* ============ ÖZET ============ */
function renderSummary(){
  const el=$("#m-ozet");
  el.innerHTML=`<div class="panel"><h2>Özet tablo (kopya kâğıdı)</h2>
  <p class="muted">${TAGS.length} etiket tek sayfada. Kendini denemek için bir sütunu gizle; gizli hücreye tıklayınca açılır. Yazdırabilirsin.</p>
  <div class="row noprint"><button class="btn ghost" data-h="etiket">Etiketleri gizle</button><button class="btn ghost" data-h="gorev">Görevleri gizle</button><button class="btn ghost" data-h="">Hepsini göster</button><button class="btn" id="pr">Yazdır</button></div>
  ${GROUPS.map(g=>'<h3 style="color:'+g.renk+'">'+g.konu+' · '+esc(g.ad)+'</h3><table class="t"><thead><tr><th>Etiket</th><th>Açılımı</th><th>Görevi</th><th>Kapanış</th></tr></thead><tbody>'+
   TAGS.filter(t=>t.g===g.id).map(t=>'<tr><td class="c-e">'+esc(t.t)+'</td><td>'+esc(t.ac)+'</td><td class="c-g">'+esc(t.k)+'</td><td>'+(t.kapanis==="yok"?"yok":t.kapanis==="özel"?"-->":"var")+'</td></tr>').join("")+'</tbody></table>').join("")}
  <h3>Sık karıştırılan çiftler</h3><table class="t"><tbody>${PAIRS.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+esc(b)+'</td></tr>').join("")}</tbody></table></div>`;
  el.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{
    el.querySelectorAll(".blur").forEach(x=>x.classList.remove("blur"));
    if(b.dataset.h==="etiket") el.querySelectorAll(".c-e").forEach(x=>x.classList.add("blur"));
    if(b.dataset.h==="gorev") el.querySelectorAll(".c-g").forEach(x=>x.classList.add("blur"));
  });
  el.querySelectorAll(".c-e,.c-g").forEach(x=>x.addEventListener("click",()=>x.classList.remove("blur")));
  $("#pr").onclick=()=>window.print();
}

function applyTheme(){ if(S.theme) document.documentElement.setAttribute("data-theme",S.theme); else document.documentElement.removeAttribute("data-theme"); }
$("#themeBtn").onclick=()=>{
  const dark = S.theme? S.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme = dark? "light":"dark"; save(); applyTheme();
};
applyTheme();

  if(h[0]==="sunum"&&h[1]!==undefined&&!isNaN(+h[1])) cur=+h[1];
  renderSlide(cur,true);
  setMode(m?m[0]:"sunum",true);
})();
</script>

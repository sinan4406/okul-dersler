<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilet Fiyatı Hesaplayıcı — Ödev</title>
</head>
<body style="font-family:sans-serif; padding:24px; max-width:420px;">

  <h1>Sinema Bileti Fiyatı</h1>
  <p>Yaşınızı girin, "Hesapla" butonuna basın. Fiyatlandırma:
  0-6 yaş ücretsiz, 7-17 yaş 50 TL, 18-64 yaş 100 TL, 65+ yaş 40 TL olmalı.
  Şu an yanlış çalışıyor — konsolu (F12) açıp <code>bozuk-yas-kontrol.js</code>
  dosyasındaki hataları bulun.</p>

  <input type="text" id="yas-input" placeholder="Yaşınız">
  <button id="hesapla-btn">Hesapla</button>

  <p id="fiyat-sonuc">Fiyat burada görünecek</p>

  <script src="bozuk-yas-kontrol.js"></script>
</body>
</html>

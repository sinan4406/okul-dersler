<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Kayıt Formu</title>
</head>
<body>

  <h1>Bahar Şenliği Kayıt Formu</h1>

  <form action="#" method="post">

    <p>
      <label for="isim">Adınız</label><br>
      <input type="text" id="ad" name="ad">
    </p>

    <p>
      <label for="soyisim">Soyadınız</label><br>
      <input type="text" id="soyad" name="soyad">
    </p>

    <p>
      <label for="dogumtarihi">Doğum Tarihiniz</label><br>
      <input type="date" id="dogum-tarihi" name="dogum-tarihi">
    </p>

    <p>
      <label for="tel">Telefon Numaranız</label><br>
      <input type="tel" id="telefon" name="telefon">
    </p>

    <p>
      <button type="submit">Kaydol</button>
    </p>

  </form>

</body>
</html>

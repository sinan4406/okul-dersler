<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim — Anadolu Teknik Lisesi</title>
</head>
<body>

  <header>
    <h1>İletişim</h1>
    <nav>
      <ul>
        <li><a href="index.html">Anasayfa</a></li>
        <li><a href="index.html#hakkimizda">Hakkımızda</a></li>
        <li><a href="index.html#bolumlerimiz">Bölümlerimiz</a></li>
        <li><a href="iletisim.html">İletişim</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Bize Ulaşın</h2>
      <p>Adres: Cumhuriyet Mahallesi, Okul Caddesi No:12, Türkiye</p>
      <p>Telefon: <a href="tel:+902125550000">(0212) 555 00 00</a></p>
      <p>E-posta: <a href="mailto:iletisim@anadoluteknik.example">iletisim@anadoluteknik.example</a></p>
    </section>

    <section>
      <h2>İletişim Formu</h2>
      <form action="#" method="post">

        <p>
          <label for="ad-soyad">Ad Soyad</label><br>
          <input type="text" id="ad-soyad" name="ad-soyad" required minlength="3">
        </p>

        <p>
          <label for="eposta">E-posta</label><br>
          <input type="email" id="eposta" name="eposta" required>
        </p>

        <p>
          <label for="telefon">Telefon</label><br>
          <input type="tel" id="telefon" name="telefon" pattern="[0-9 ()+-]{10,}">
        </p>

        <p>
          <label for="konu">Konu</label><br>
          <select id="konu" name="konu">
            <option value="kayit">Kayıt Bilgisi</option>
            <option value="bolum">Bölüm Hakkında Bilgi</option>
            <option value="diger">Diğer</option>
          </select>
        </p>

        <p>
          <label for="mesaj">Mesajınız</label><br>
          <textarea id="mesaj" name="mesaj" rows="5" required></textarea>
        </p>

        <p>
          <button type="submit">Gönder</button>
        </p>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Anadolu Teknik Lisesi</p>
  </footer>

</body>
</html>

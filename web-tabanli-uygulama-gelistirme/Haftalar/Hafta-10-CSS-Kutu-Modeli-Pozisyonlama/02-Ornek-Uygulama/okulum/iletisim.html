     durumun varsayımsal bir devamıdır. HTML5 haftalarının kendi çıktısı farklıysa, CSS ünitesine
     başlamadan önce bu dosyayı gerçek Hafta 8 çıktısıyla uyumlu hâle getirin. -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim — Anadolu Teknik Lisesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Anadolu Teknik Lisesi</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="index.html#hakkimizda">Hakkımızda</a>
      <a href="index.html#bolumler">Bölümlerimiz</a>
      <a href="iletisim.html">İletişim</a>
    </nav>
  </header>

  <main>
    <section id="iletisim-bilgisi">
      <h2>İletişim Bilgilerimiz</h2>
      <address>
        Adres: Cumhuriyet Mahallesi, Okul Caddesi No:12, Merkez<br>
        Telefon: <a href="tel:+903121234567">0 312 123 45 67</a><br>
        E-posta: <a href="mailto:bilgi@anadoluteknik.example">bilgi@anadoluteknik.example</a>
      </address>
    </section>

    <section id="iletisim-form">
      <h2>Bize Yazın</h2>
      <form action="#" method="post">
        <label for="ad">Adınız Soyadınız</label>
        <input type="text" id="ad" name="ad" required>

        <label for="eposta">E-posta Adresiniz</label>
        <input type="email" id="eposta" name="eposta" required>

        <label for="mesaj">Mesajınız</label>
        <textarea id="mesaj" name="mesaj" rows="5" required></textarea>

        <button type="submit">Gönder</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Anadolu Teknik Lisesi — Tüm hakları saklıdır.</p>
    <p><a href="index.html">Ana sayfaya dön</a></p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulüplerimiz</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }

    .kapsayici {
      display: flex;
      gap: 12px;
      border: 2px dashed #999;
      padding: 10px;
    }

    /* GÖREV: Bu 3 kart aynı satırda, kapsayıcının kesikli çerçevesi içinde yan yana durmalı.
       Şu an her biri çerçeveyi taşıyor ve alt alta kayıyor. Neden? */
    .kart {
      width: 33%;
      padding: 16px;
      border: 3px solid #1565c0;
      background: #e3f2fd;
    }
  </style>
</head>
<body>

  <h1>Kulüplerimiz</h1>

  <div class="kapsayici">
    <div class="kart"><h3>Satranç</h3><p>Her Çarşamba, kütüphane.</p></div>
    <div class="kart"><h3>Robotik</h3><p>Her Cuma, atölye.</p></div>
    <div class="kart"><h3>Tiyatro</h3><p>Her Salı, konferans salonu.</p></div>
  </div>

</body>
</html>

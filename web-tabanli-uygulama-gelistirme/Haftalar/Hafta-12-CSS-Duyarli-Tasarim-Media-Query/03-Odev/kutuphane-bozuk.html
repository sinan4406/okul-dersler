<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kütüphane Duyuruları</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .icerik {
      width: 800px;
      margin: 0 auto;
      padding: 24px;
    }
    .duyuru {
      background: #eef1f4;
      border-left: 4px solid #1c2a38;
      padding: 14px 18px;
      margin-bottom: 14px;
    }
    /* Dar ekranda yazı boyutunu küçültmek için yazıldı ama bir yazım hatası var */
    @media (max-width 600px) {
      body { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="icerik">
    <h1>Kütüphane Duyuruları</h1>
    <div class="duyuru">
      <h2>Yeni Kitaplar Geldi</h2>
      <p>Bilim kurgu ve kişisel gelişim kategorilerinde 40'tan fazla yeni kitap kütüphanemize eklendi.</p>
    </div>
    <div class="duyuru">
      <h2>Sınav Dönemi Çalışma Saatleri</h2>
      <p>Sınav döneminde kütüphanemiz hafta içi 07:30 - 19:00 saatleri arasında açık olacaktır.</p>
    </div>
  </div>

</body>
</html>

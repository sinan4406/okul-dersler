<!-- OKULUM PROJESİ — İletişim sayfası (CSS ünitesi sonu hâli). Bkz. okulum-index.html üstündeki not. -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim — Anadolu Teknik Lisesi</title>
  <link rel="stylesheet" href="okulum-style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Anadolu Teknik Lisesi</div>
    <nav class="site-nav">
      <a href="okulum-index.html">Anasayfa</a>
      <a href="okulum-index.html#bolumler">Bölümler</a>
      <a href="okulum-index.html#galeri">Galeri</a>
      <a href="okulum-iletisim.html">İletişim</a>
    </nav>
  </header>

  <main>
    <section class="form-alani">
      <h1>Bize Ulaşın</h1>
      <form>
        <label for="adsoyad">Ad Soyad</label>
        <input type="text" id="adsoyad" name="adsoyad" required>

        <label for="eposta">E-posta</label>
        <input type="email" id="eposta" name="eposta" required>

        <label for="konu">Konu</label>
        <select id="konu" name="konu">
          <option value="kayit">Kayıt Bilgisi</option>
          <option value="mufredat">Müfredat Hakkında</option>
          <option value="diger">Diğer</option>
        </select>

        <fieldset>
          <legend>Kimliğiniz</legend>
          <label><input type="radio" name="kimlik" value="ogrenci" checked> Öğrenci</label>
          <label><input type="radio" name="kimlik" value="veli"> Veli</label>
          <label><input type="radio" name="kimlik" value="mezun"> Mezun</label>
        </fieldset>

        <label for="mesaj">Mesajınız</label>
        <textarea id="mesaj" name="mesaj" rows="5" required></textarea>

        <button type="submit">Gönder</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Anadolu Teknik Lisesi — Bilişim Teknolojileri Bölümü</p>
  </footer>

</body>
</html>

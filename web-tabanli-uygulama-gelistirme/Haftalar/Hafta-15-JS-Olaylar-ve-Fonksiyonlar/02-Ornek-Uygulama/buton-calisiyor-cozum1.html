<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çözüm 1: Script'i Sona Taşımak</title>
</head>
<body style="font-family:sans-serif; padding:24px;">

  <h1>Çözüm 1: Script'i Body'nin Sonuna Taşımak</h1>
  <p>Konsolu (F12) açın, tıklayın — artık çalışıyor.</p>

  <button id="tikla-btn">Tıkla Bana</button>

  <!-- Script artık en sonda — buton, JS çalıştığında zaten oluşmuş durumda. -->
  <script>
    const btn = document.querySelector("#tikla-btn");
    btn.addEventListener("click", function () {
      alert("Tıklandı!");
    });
  </script>
</body>
</html>

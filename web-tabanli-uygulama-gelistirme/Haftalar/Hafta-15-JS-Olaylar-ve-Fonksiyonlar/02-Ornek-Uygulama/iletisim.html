<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Anadolu Teknik Lisesi</div>
    <nav>
      <a href="index.html">Anasayfa</a>
      <a href="iletisim.html">İletişim</a>
    </nav>
  </header>

  <div class="hero">
    <h1>İletişim</h1>
    <p>Sorularınız için bize aşağıdaki formdan ulaşabilirsiniz.</p>
  </div>

  <main>
    <section>
      <h2>İletişim Formu</h2>
      <form id="iletisim-formu">
        <label for="ad">Ad Soyad</label>
        <input type="text" id="ad" name="ad">

        <label for="eposta">E-posta</label>
        <input type="text" id="eposta" name="eposta">

        <label for="mesaj">Mesajınız</label>
        <textarea id="mesaj" name="mesaj"></textarea>

        <button type="submit">Gönder</button>

        <div class="mesaj-kutusu" id="form-geri-bildirim"></div>
      </form>
    </section>
  </main>

  <footer>&copy; 2026 Anadolu Teknik Lisesi</footer>

  <script src="script.js"></script>

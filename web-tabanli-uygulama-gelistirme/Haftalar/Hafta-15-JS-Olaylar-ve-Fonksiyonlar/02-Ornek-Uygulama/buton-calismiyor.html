<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butonum Neden Çalışmıyor?</title>

  <!-- DİKKAT: script burada, <head> içinde. Tarayıcı sayfayı yukarıdan
       aşağı okur — bu satır çalıştığında <body> içindeki buton HENÜZ
       oluşturulmamıştır. document.querySelector bu yüzden null döner. -->
  <script>
    const btn = document.querySelector("#tikla-btn");
    btn.addEventListener("click", function () {
      alert("Tıklandı!");
    });
  </script>
</head>
<body style="font-family:sans-serif; padding:24px;">

  <h1>Butonum Neden Çalışmıyor?</h1>
  <p>Konsolu (F12) açın, sayfayı yenileyin (F5) ve kırmızı hata mesajını okuyun.</p>

  <button id="tikla-btn">Tıkla Bana</button>

</body>
</html>

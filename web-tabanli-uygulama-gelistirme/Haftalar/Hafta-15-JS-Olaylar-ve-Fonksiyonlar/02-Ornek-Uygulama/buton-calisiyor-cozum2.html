<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çözüm 2: DOMContentLoaded Kullanmak</title>

  <!-- Script hâlâ <head> içinde, ama artık "sayfa tamamen yüklenene kadar
       bekle" diyoruz — DOMContentLoaded olayı tam bunun için var. -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const btn = document.querySelector("#tikla-btn");
      btn.addEventListener("click", function () {
        alert("Tıklandı!");
      });
    });
  </script>
</head>
<body style="font-family:sans-serif; padding:24px;">

  <h1>Çözüm 2: DOMContentLoaded ile Beklemek</h1>
  <p>Konsolu (F12) açın, tıklayın — bu da çalışıyor.</p>

  <button id="tikla-btn">Tıkla Bana</button>

</body>
</html>

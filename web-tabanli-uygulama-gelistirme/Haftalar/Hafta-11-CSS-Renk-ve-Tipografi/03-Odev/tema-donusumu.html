<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulüp Etkinlik Duyurusu</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }

    /* GÖREV: Aşağıdaki #7b2cbf değeri 5 farklı yerde elle yazılmış.
       Bunu tek bir CSS değişkenine (:root içinde) dönüştürün ve her yerde var() ile kullanın.
       Sonra --marka-rengi değerini değiştirerek TÜM sayfanın renginin tek satırla değiştiğini kanıtlayın. */

    header { background: #7b2cbf; color: white; padding: 16px; }
    .baslik { color: #7b2cbf; }
    .rozet { background: #7b2cbf; color: white; padding: 4px 10px; border-radius: 999px; }
    .cizgi { border-bottom: 3px solid #7b2cbf; padding-bottom: 8px; }
    footer { border-top: 2px solid #7b2cbf; padding-top: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>Kulüp Etkinlik Duyurusu</h1>
  </header>

  <h2 class="baslik cizgi">Fotoğrafçılık Kulübü Gezisi</h2>
  <p>Bu Cumartesi, tüm kulüp üyeleri için şehir merkezinde bir fotoğraf gezisi düzenlenecektir.
  <span class="rozet">Yeni</span></p>

  <footer>
    <p>Detaylar için kulüp danışmanına başvurabilirsiniz.</p>
  </footer>

</body>
</html>

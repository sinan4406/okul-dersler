<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıp Eleman — Hata Avı</title>
</head>
<body>

  <h1>Sınıf Listesi</h1>
  <p>Aşağıdaki kod, sınıf listesini hem sayfaya hem konsola yazdırmaya çalışıyor. Ama bir şeyler
  ters gidiyor... Tarayıcı konsolunu açın (F12 → Console) ve çıktının SON satırına dikkatlice bakın.</p>

  <pre id="cikti" style="background:#111;color:#0f0;padding:16px;border-radius:8px;font-family:monospace;"></pre>

  <script>
    const ogrenciler = ["Ayşe", "Mehmet", "Elif", "Can", "Zeynep"];
    const cikti = document.getElementById("cikti");

    // GÖREV: Bu döngüde bir "off-by-one" (bir fazla) hatası var.
    // Çalıştırın, hem sayfada hem konsolda ne olduğunu gözlemleyin,
    // sonra <= işaretini < ile değiştirip tekrar deneyin.
    for (let i = 0; i <= ogrenciler.length; i++) {
      console.log(i + ". öğrenci: " + ogrenciler[i]);
      cikti.textContent += (i + 1) + ". öğrenci: " + ogrenciler[i] + "\n";
    }
  </script>

</body>
</html>

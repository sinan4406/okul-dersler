<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>for vs forEach vs map</title>
</head>
<body>

  <h1>Aynı İş, Üç Farklı Yöntem</h1>
  <p>Aşağıdaki üç liste, aynı <code>notlar</code> dizisinden, üç farklı yöntemle üretiliyor.
  Konsolu açıp her yöntemin kodunu birlikte inceleyin.</p>

  <h2>1) Klasik for döngüsü</h2>
  <ul id="liste-for"></ul>

  <h2>2) forEach()</h2>
  <ul id="liste-foreach"></ul>

  <h2>3) map() (yeni bir dizi üretip sonra listeye basıyoruz)</h2>
  <ul id="liste-map"></ul>

  <script>
    const notlar = [85, 90, 72, 100, 65];

    // 1) Klasik for döngüsü — index'i biz yönetiyoruz
    const listeFor = document.getElementById("liste-for");
    for (let i = 0; i < notlar.length; i++) {
      listeFor.innerHTML += "<li>" + (i + 1) + ". öğrenci: " + notlar[i] + " puan</li>";
    }

    // 2) forEach() — index hesaplama derdi yok
    const listeForEach = document.getElementById("liste-foreach");
    notlar.forEach(function (not, index) {
      listeForEach.innerHTML += "<li>" + (index + 1) + ". öğrenci: " + not + " puan</li>";
    });

    // 3) map() — önce yeni bir "metin dizisi" üretiyoruz, sonra tek seferde birleştirip basıyoruz
    const listeMap = document.getElementById("liste-map");
    const satirlar = notlar.map(function (not, index) {
      return "<li>" + (index + 1) + ". öğrenci: " + not + " puan</li>";
    });
    listeMap.innerHTML = satirlar.join("");
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toplama Makinesi (Bozuk)</title>
</head>
<body style="font-family:sans-serif; padding:24px; max-width:420px;">

  <h1>Basit Toplama Makinesi</h1>
  <p>İki sayı gir, "Topla" butonuna bas, sonucu kontrol et. (Konsolu F12 ile açık tutun.)</p>

  <input type="text" id="sayi1" placeholder="1. sayı" style="width:100px;">
  +
  <input type="text" id="sayi2" placeholder="2. sayı" style="width:100px;">
  <button id="topla-btn">Topla</button>

  <p>Sonuç: <span id="sonuc" style="font-weight:bold;">-</span></p>

  <hr style="margin:28px 0;">

  <p><b>Ekstra deney:</b> Yukarıdaki hatayı düzelttikten sonra (bkz. hata-nan-cozum.html), 1. sayı
  kutusuna virgüllü bir ondalık sayı yazmayı deneyin, örn. <code>7,5</code>. Ne çıkıyor? Neden?</p>

  <script>
    const btn = document.querySelector("#topla-btn");

    btn.addEventListener("click", function () {
      const s1 = document.querySelector("#sayi1").value;
      const s2 = document.querySelector("#sayi2").value;

      // DİKKAT 1: s1 ve s2, input.value'dan geldiği için aslında birer STRING'dir,
      // number değil. "+" operatörü iki string'i yan yana EKLER (concat), toplamaz!
      const toplam = s1 + s2;

      document.querySelector("#sonuc").textContent = toplam;
      console.log("s1:", s1, "| tipi:", typeof s1);
      console.log("s2:", s2, "| tipi:", typeof s2);
      console.log("toplam:", toplam);

      // DİKKAT 2: Number() ile çevirseniz bile, Türkçe alışkanlıkla yazılan
      // virgüllü ondalık sayılar (örn. "7,5") JS'te NaN (Not a Number) üretir,
      // çünkü Javascript ondalık ayracı olarak NOKTA bekler, VİRGÜL değil.
      console.log('Number("7,5") =', Number("7,5"));   // NaN
      console.log('Number("7.5") =', Number("7.5"));   // 7.5
    });
  </script>

</body>
</html>

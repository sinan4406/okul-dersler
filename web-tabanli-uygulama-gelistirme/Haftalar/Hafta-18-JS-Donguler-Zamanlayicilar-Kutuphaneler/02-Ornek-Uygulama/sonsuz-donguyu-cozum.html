<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonsuz Döngü — Çözüm</title>
</head>
<body>

  <h1>Düzeltilmiş Kod (Güvenle Çalıştırılabilir)</h1>
  <pre id="cikti" style="background:#111;color:#0f0;padding:16px;border-radius:8px;font-family:monospace;"></pre>

  <script>
    // Hata: "sayi = 1" satırı, sayi'yi her turda tekrar 1 yapıyordu, hiç artmıyordu.
    // Düzeltme: "sayi = sayi + 1" (ya da sayi++) ile her turda gerçekten artırıyoruz.
    let sayi = 1;
    const cikti = document.getElementById("cikti");
    while (sayi <= 5) {
      cikti.textContent += sayi + "\n";
      sayi = sayi + 1; // düzeltme burada
    }
  </script>

</body>
</html>

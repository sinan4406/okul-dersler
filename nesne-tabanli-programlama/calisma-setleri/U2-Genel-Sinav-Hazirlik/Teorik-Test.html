      int bolen = 2 - sayac;\n        int sonuc = 6 / bolen;\n        toplam += sonuc;\n    }\n    catch\n    {\n        hata++;\n    }\n}\nlblSonuc.Text = toplam.ToString() + \" / \" + hata.ToString();<\/pre>", "z": 3}, {"t": "mc", "topic": "Yapı seçimi ve birleştirme", "q": "Aşağıdaki kod çalışınca <code>lblSonuc<\/code> etiketinde ne görünür?", "opts": ["10 / 6", "55 / 3", "40 / 4", "70 / 2"], "ans": 1, "exp": "para 100 → 85 → 70 → 55 olurken bilet 3 olur. Bu noktada para >= 15 hâlâ true ama bilet < 3 false; && ile bağlı koşulun biri bozulunca döngü durur: 55 / 3. İkinci koşul olmasaydı döngü para 10'a düşene kadar sürerdi (10 / 6).", "ref": "S3 + S5 · while koşulunda &&", "case": "<pre class=\"code\">int para = 100;\nint bilet = 0;\nwhile ( para &gt;= 15 &amp;&amp; bilet &lt; 3 )\n{\n    para -= 15;\n    bilet++;\n}\nlblSonuc.Text = para.ToString() + \" / \" + bilet.ToString();<\/pre>", "z": 3}, {"t": "mc", "topic": "Yapı seçimi ve birleştirme", "q": "Her denemede form yeniden açılıyor (Label boş). Sırasıyla (yas 70, tür Öğrenci, engelli işaretsiz), (yas 5, tür Tam, engelli işaretsiz) ve (yas 20, tür tam, engelli işaretli) için etikette ne görünür?", "opts": ["12 TL, 0 TL, 20 TL", "13 TL, 0 TL, 15 TL", "12 TL, 0 TL, 15 TL", "12 TL, 40 TL, 15 TL"], "ans": 2, "exp": "1) yas >= 7: switch \"Öğrenci\" → 25; yas > 65 olduğu için yarıya iner: 25 / 2 = 12 (int bölmesi). 2) yas < 7: dış if false, ücret 0. 3) \"tam\" ile \"Tam\" farklıdır; default 30; engelli işaretli olduğu için || true, 30 / 2 = 15. 20, \"tam\"ın \"Tam\" ile eşleştiğini sanan; 13 bölmeyi yuvarlayan; 40 dış if'i yok sayan hatadır.", "ref": "S1 + S2 + S3 · if, switch ve || birlikte", "case": "<pre class=\"code\">int yas = Convert.ToInt32(txtYas.Text);\nint ucret = 0;\nif ( yas &gt;= 7 )\n{\n    switch ( txtTur.Text )\n    {\n        case \"Tam\":\n            ucret = 40;\n            break;\n        case \"Öğrenci\":\n            ucret = 25;\n            break;\n        default:\n            ucret = 30;\n            break;\n    }\n    if ( yas &gt; 65 || chkEngelli.Checked == true )\n    {\n        ucret = ucret / 2;\n    }\n}\nlblUcret.Text = ucret.ToString() + \" TL\";<\/pre>", "z": 3}, {"t": "multi", "topic": "Yapı seçimi ve birleştirme", "q": "Aşağıdaki döngülerden hangileri ListBox'a 2, 4, 6, 8 değerlerini bu sırayla ekler? (Her seçenek ayrı bir programdır; üç doğru vardır.)", "opts": ["A", "B", "C", "D"], "ans": [0, 2, 3], "exp": "A: 2'den 8'e 2'şer. B: koşul sayi < 8 olduğu için 8 eklenmeden biter (2, 4, 6). C: do-while 2, 4, 6, 8 ekler; 8'den sonra 8 < 8 false. D: tek sayılarda continue çalışır, çift sayılar eklenir.", "ref": "S4 + S5 · Aynı çıktıyı veren döngüler", "case": "<pre class=\"code\">// A\nfor ( int sayi = 2; sayi &lt;= 8; sayi += 2 )\n{\n    lstSonuc.Items.Add(sayi.ToString());\n}\n\n// B\nint sayi = 2;\nwhile ( sayi &lt; 8 )\n{\n    lstSonuc.Items.Add(sayi.ToString());\n    sayi += 2;\n}\n\n// C\nint sayi = 0;\ndo\n{\n    sayi += 2;\n    lstSonuc.Items.Add(sayi.ToString());\n}\nwhile ( sayi &lt; 8 );\n\n// D\nfor ( int sayi = 1; sayi &lt;= 8; sayi++ )\n{\n    if ( sayi % 2 == 1 )\n    {\n        continue;\n    }\n    lstSonuc.Items.Add(sayi.ToString());\n}<\/pre>", "z": 3}, {"t": "tf", "topic": "while ve do-while", "q": "for ile yazılmış bir döngü while'a çevrilirken gövdede continue varsa, artış satırı (sayac++) gövdenin en sonunda bırakılırsa ve continue ondan önce çalışırsa döngü sonsuza gidebilir.", "ans": true, "exp": "for'da artış her turun sonunda kendiliğinden çalışır. while'da artış gövdeye yazılmıştır; continue o satırı atlarsa sayac değişmez, koşul hep aynı sonucu verir ve döngü bitmez.", "ref": "S4 + S5 · for ile while ve continue", "z": 3}, {"t": "mc", "topic": "break ve continue", "q": "Aşağıdaki kod çalışınca <code>lblToplam<\/code> etiketinde ne görünür?", "opts": ["37", "3", "27", "19"], "ans": 3, "exp": "sayac 1 ve 2 toplanır (3). 3 continue ile atlanır; 4 ve 5 eklenir (12); 6 atlanır; 7 eklenir (19). 8'de sayac > 7 true olur v
